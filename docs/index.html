<script>
function updateLogoDarkMode() {
  const isDarkMode = document.body.classList.contains('dark-mode');
  const teleIcon = document.getElementById('tele-logo');
  const xIcon = document.getElementById('x-logo');
  if (teleIcon) teleIcon.style.filter = isDarkMode ? 'brightness(0) saturate(100%) invert(100%)' : 'brightness(0) saturate(100%)';
  if (xIcon) xIcon.style.filter = isDarkMode ? 'brightness(0) saturate(100%) invert(100%)' : 'brightness(0) saturate(100%)';
}

function isMobileLandscape() {
  const ua = navigator.userAgent || navigator.vendor || window.opera || '';
  const isIPad = /iPad/.test(ua);
  const isMobileUserAgent = /Mobi|Android/i.test(ua);
  const width = window.innerWidth;
  const height = window.innerHeight;
  const isLandscape = (window.matchMedia && window.matchMedia('(orientation: landscape)').matches) || (width > height);
  const isMobile = !isIPad && (isMobileUserAgent || width <= 768);
  return isMobile && isLandscape;
}

function enforceMobileLandscapeEmptyState() {
  if (isMobileLandscape()) {
    document.querySelectorAll('.empty-state').forEach(el => el.remove());
  }
}

window.addEventListener('load', updateLogoDarkMode);
window.addEventListener('load', enforceMobileLandscapeEmptyState);
window.addEventListener('resize', enforceMobileLandscapeEmptyState);
window.addEventListener('orientationchange', enforceMobileLandscapeEmptyState);
document.addEventListener('themechanged', updateLogoDarkMode);

const observer = new MutationObserver(() => updateLogoDarkMode());
observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });

document.addEventListener('DOMContentLoaded', function() {
  const socialLinks = document.querySelectorAll('#social-tele, #social-twit');
  socialLinks.forEach(link => {
    link.style.pointerEvents = 'auto';
    link.style.touchAction = 'manipulation';
    link.addEventListener('touchstart', function() {
      this.style.opacity = '0.6';
    }, false);
    link.addEventListener('touchend', function(e) {
      this.style.opacity = '1';
      if (!e.defaultPrevented) {
        e.preventDefault();
        this.click();
      }
    }, false);
    link.addEventListener('touchcancel', function() {
      this.style.opacity = '1';
    }, false);
    link.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        this.click();
      }
    });
  });
  
  // Do not force a global touchend click for all buttons.
  // It causes duplicate tap activation on mobile and makes confirm prompts appear only after repeated presses.
});
</script>

    <script>

    // Custom confirm modal for all links
    function customConfirm(message, url) {
        return new Promise((resolve) => {
            let settled = false;

            // Remove any existing modals
            const existingModals = document.querySelectorAll('.custom-confirm-modal');
            existingModals.forEach(modal => modal.remove());

            const modal = document.createElement('div');
            modal.className = 'custom-confirm-modal';
            modal.style.zIndex = '999999999';
            modal.innerHTML = `
                <div class="custom-confirm-box">
                    <div>${message}</div>
                    <div class="custom-confirm-buttons">
                        <button type="button" class="custom-confirm-btn yes" id="custom-confirm-yes">Yes</button>
                        <button type="button" class="custom-confirm-btn no" id="custom-confirm-no">No</button>
                    </div>
                </div>
            `;
            
            const cleanup = () => {
                modal.remove();
                document.removeEventListener('keydown', handleKeyboard);
                document.removeEventListener('click', handleModalClick);
            };

            const handleYes = (e) => {
                if (settled) return;
                settled = true;
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                cleanup();
                if (url) {
                    window.open(url, '_blank');
                }
                resolve(true);
            };

            const handleNo = (e) => {
                if (settled) return;
                settled = true;
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                cleanup();
                resolve(false);
            };

            const handleKeyboard = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleYes(e);
                }
                if (e.key === 'Escape') {
                    e.preventDefault();
                    handleNo(e);
                }
            };

            const handleModalClick = (e) => {
                if (e.target === modal) {
                    e.preventDefault();
                    handleNo(e);
                }
            };

            // Attach event listeners with proper cleanup
            const yesButton = modal.querySelector('#custom-confirm-yes');
            const noButton = modal.querySelector('#custom-confirm-no');
            
            yesButton.addEventListener('click', handleYes, { passive: false });
            noButton.addEventListener('click', handleNo, { passive: false });
            yesButton.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                handleYes(e);
            }, { passive: false });
            noButton.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                handleNo(e);
            }, { passive: false });
            modal.addEventListener('click', handleModalClick, { passive: false });
            document.addEventListener('keydown', handleKeyboard);
            
            // Add modal to document
            document.body.appendChild(modal);
            
            // Focus Yes button
            requestAnimationFrame(() => {
                yesButton.focus();
            });
        });
    }

    function openDashboardMultiChart() {
        // Get current alert tickers from actual dashboard data.
        let alerts = [];
        if (window.alerts && Array.isArray(window.alerts)) {
            alerts = window.alerts;
        } else if (window.dashboard && window.dashboard.alerts instanceof Map) {
            alerts = Array.from(window.dashboard.alerts.values()).flat();
        }

        const alertsByTicker = new Map();
        const tickers = alerts.map(alert => {
            if (alert && alert.ticker) {
                alertsByTicker.set(alert.ticker, alert);
                return alert.ticker;
            }
            return null;
        }).filter(Boolean).slice(0, 12);
        if (tickers.length === 0) {
            if (window.dashboard && typeof window.dashboard.showNotification === 'function') {

            display: grid;
            grid-template-columns: ${gridCols};
            gap: 8px;
            padding: 10px;
            overflow-y: auto;
            max-height: calc(90vh - 90px);
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        `;

        let viewMode = 'grid';
        const closeModal = () => {
            modal.remove();
            document.body.style.overflow = bodyOverflowBackup || '';
            document.documentElement.style.overflow = htmlOverflowBackup || '';
        };

        const toggleButton = header.querySelector('.multi-chart-toggle-btn');
        const closeButton = header.querySelector('.multi-chart-close-btn');
        const viewLabel = (mode) => {
            if (isIPhonePortrait) {
                return mode === 'single' ? 'Single' : 'Grid';
            }
            return mode === 'single' ? 'Single View' : 'Grid View';
        };

        toggleButton.textContent = viewLabel('single');

        const updateViewMode = (mode) => {
            viewMode = mode;
            if (mode === 'single') {
                chartsGrid.style.gridTemplateColumns = '1fr';

            const alertPriceText = alertPriceValue !== null && alertPriceValue !== undefined ? `$${parseFloat(alertPriceValue).toFixed(4)}` : 'N/A';

            chartWrapper.innerHTML = '<div id="' + chartId + '" style="width: 100%; height: 100%;"></div>';

            chartContainer.appendChild(chartHeader);
            chartContainer.appendChild(chartWrapper);
            chartsGrid.appendChild(chartContainer);

            // Load TradingView chart
            setTimeout(() => {
                const script = document.createElement('script');
                script.type = 'text/javascript';
                script.src = 'https://s3.tradingview.com/tv.js';
                script.onload = function() {

                        "enable_publishing": false,
                        "allow_symbol_change": true,

                    });

            }, 100 * index);  // Stagger loading
        });

        // Drag and drop functionality
        let draggedElement = null;
        let touchStartX, touchStartY, isDragging = false;

        chartsGrid.addEventListener('dragstart', (e) => {
            draggedElement = e.target.closest('.multi-chart-item');
            if (draggedElement) {
                e.dataTransfer.effectAllowed = 'move';
                draggedElement.style.opacity = '0.5';
            }
        });

        chartsGrid.addEventListener('dragend', (e) => {
            if (draggedElement) {
                draggedElement.style.opacity = '1';
                draggedElement = null;
            }
        });

        chartsGrid.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });

        chartsGrid.addEventListener('drop', (e) => {
            e.preventDefault();
            const target = e.target.closest('.multi-chart-item');
            if (draggedElement && target && draggedElement !== target) {
                const allItems = Array.from(chartsGrid.children);
                const draggedIndex = allItems.indexOf(draggedElement);
                const targetIndex = allItems.indexOf(target);

                if (draggedIndex < targetIndex) {
                    chartsGrid.insertBefore(draggedElement, target.nextSibling);
                } else {
                    chartsGrid.insertBefore(draggedElement, target);
                }
            }
        });

        // Touch drag and drop for mobile devices
        chartsGrid.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            draggedElement = e.target.closest('.multi-chart-item');
            if (draggedElement) {
                isDragging = true;
                draggedElement.style.opacity = '0.5';
            }
        });

        chartsGrid.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
        });

        chartsGrid.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            const touch = e.changedTouches[0];
            const deltaX = Math.abs(touch.clientX - touchStartX);
            const deltaY = Math.abs(touch.clientY - touchStartY);
            if (deltaX > 50 || deltaY > 50) { // threshold for drag
                const target = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.multi-chart-item');
                if (draggedElement && target && draggedElement !== target) {
                    const allItems = Array.from(chartsGrid.children);
                    const draggedIndex = allItems.indexOf(draggedElement);
                    const targetIndex = allItems.indexOf(target);
                    if (draggedIndex < targetIndex) {
                        chartsGrid.insertBefore(draggedElement, target.nextSibling);
                    } else {
                        chartsGrid.insertBefore(draggedElement, target);
                    }
                }
            }
            if (draggedElement) {
                draggedElement.style.opacity = '1';
            }
            draggedElement = null;
            isDragging = false;
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        document.body.appendChild(modal);
    }

    // Console filter to suppress DNS resolution logs for www.sec.gov
    (function() {
        const originalLog = console.log;
        const originalInfo = console.info;
        const originalWarn = console.warn;
        const originalError = console.error;

        function shouldFilter(message) {
            return typeof message === 'string' && message.includes('DNS resolved www.sec.gov');
        }

        console.log = function(...args) {
            if (!shouldFilter(args.join(' '))) {
                originalLog.apply(console, args);
            }
        };

        console.info = function(...args) {
            if (!shouldFilter(args.join(' '))) {
                originalInfo.apply(console, args);
            }
        };

        console.warn = function(...args) {
            if (!shouldFilter(args.join(' '))) {
                originalWarn.apply(console, args);
            }
        };

        console.error = function(...args) {
            if (!shouldFilter(args.join(' '))) {
                originalError.apply(console, args);
            }
        };
    })();

            // Apply dark mode theme immediately to prevent flash
            (function() {
                const savedTheme = localStorage.getItem('theme');
                const isDarkMode = savedTheme === 'dark';
                const screen = document.getElementById('loading-screen');
                if (screen) {
                    const symbol = screen.querySelector('div:first-child');

                    const bar = document.getElementById('loading-bar');
                    
                    if (isDarkMode) {

        <script>
            // Detect dark mode and apply to loading screen
            function applyLoadingTheme() {
                const savedTheme = localStorage.getItem('theme');
                const darkModeEnabled = savedTheme === 'dark';
                const screen = document.getElementById('loading-screen');
                const symbol = screen.querySelector('div:first-child');
                const text = screen.querySelector('div:nth-child(2)');
                const barContainer = screen.querySelector('div:nth-child(3)');
                const bar = document.getElementById('loading-bar');
                
                if (darkModeEnabled) {
                    screen.style.background = '#1a1a1a';
                    symbol.style.color = '#ffffff';
                    text.style.color = '#ffffff';
                    barContainer.style.background = 'rgba(255, 255, 255, 0.1)';
                    bar.style.background = '#ffffff';
                } else {
                    screen.style.background = '#ffffff';
                    symbol.style.color = '#000000';
                    text.style.color = '#000000';
                    barContainer.style.background = 'rgba(0, 0, 0, 0.1)';
                    bar.style.background = '#000000';
                }
            }
            
            applyLoadingTheme();
            
            // Animate progress bar
            let progress = 0;
            const progressInterval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.random() * 30;
                    if (progress > 90) progress = 90;
                    document.getElementById('loading-bar').style.width = progress + '%';
                }
            }, 300);
            
            // Hide loading screen when dashboard is ready (800ms min)
            let loadingStarted = Date.now();
            function hideLoading() {
                clearInterval(progressInterval);
                const elapsed = Date.now() - loadingStarted;
                const delay = Math.max(300 - elapsed, 0);
                setTimeout(() => {
                    const screen = document.getElementById('loading-screen');
                    if (screen) {
                        document.getElementById('loading-bar').style.width = '100%';
                        setTimeout(() => {
                            // Fade out elements with stagger
                            const symbol = document.getElementById('loading-symbol');
                            const text = document.getElementById('loading-text');
                            const barContainer = document.getElementById('loading-bar-container');
                            if (symbol) symbol.style.opacity = '0';
                            if (text) text.style.opacity = '0';
                            if (barContainer) barContainer.style.opacity = '0';
                            setTimeout(() => {
                                screen.style.transition = 'opacity 0.6s ease-out';
                                screen.style.opacity = '0';
                                screen.style.pointerEvents = 'none';
                                setTimeout(() => screen.remove(), 600);
                            }, 150);
                        }, 300);
                    }
                }, delay);
            }
        </script>

                <button id="push-notif-btn" onclick="openPushNotificationSettings()" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #999; background: #f0f0f0; cursor: pointer; font-size: 12px; color: #333;">Push Notify</button>

        <div class="notification-panel-header">
            <div style="display: flex; gap: 15px; flex: 1;">
                <button class="notification-tab active" onclick="switchNotificationTab('recent')">Recent</button>
                <button class="notification-tab" onclick="switchNotificationTab('history')">History</button>

            <!-- Recent alerts will be populated here -->

            <!-- History alerts will be populated here -->
        </div>

            <!-- Inbox messages will be populated here -->
        </div>
    </div>

    <script>
        // Function to identify short setups
        function isShortSetup(alert) {
            // First check if alert has isShort or short property set
            if (alert.isShort === true || alert.short === true) return true;
            if (alert.isShort === false || alert.short === false) return false;
            
            if (!alert || !alert.intent) return false;
            
            // Check for primary short signals
            const hasReverseSplit = alert.intent.includes("Reverse Split");
            const hasBankruptcy = alert.intent.includes("Bankruptcy/Insolvency");
            const hasDilution = alert.intent.includes("Dilution");
            const hasGoingPrivate = alert.intent.includes("Going Private");
            
            // Short setup conditions in order of priority
            if (hasBankruptcy) return true; // Bankruptcy is always a short
            if (hasGoingPrivate) return true; // Going private low-ball offer is always a short
            if (hasReverseSplit && hasDilution) return true; // Reverse split + dilution combo
            if (hasReverseSplit) return true; // Any reverse split
            if (hasDilution && alert.intent.length === 1) return true; // Pure dilution with no other bullish signals
            
            // Consider a combination of dilution with other bearish signals
            if (hasDilution && alert.intent.some(signal => 
                signal.includes("Desperation") || 
                signal.includes("Bankruptcy") || 
                signal.includes("Insolvency"))) {
                return true;
            }
            
            return false;
        }

        // Function to calculate expiry date (3 days if Tue-Sun, 4 days if Monday, excluding weekends)
        function calculateExpiryDate() {
            const now = new Date();
            const dayOfWeek = now.getDay(); // 0 = Sunday, 1 = Monday, 2-6 = Tue-Sat
            
            // Determine business days to add: 4 if Monday, 3 if Tue-Sun
            const businessDaysToAdd = dayOfWeek === 1 ? 4 : 3;
            
            let expiryDate = new Date(now);
            let businessDaysAdded = 0;
            
            // Add days while skipping weekends
            while (businessDaysAdded < businessDaysToAdd) {
                expiryDate.setDate(expiryDate.getDate() + 1);
                const newDayOfWeek = expiryDate.getDay();
                
                // Skip Saturday (6) and Sunday (0)
                if (newDayOfWeek !== 0 && newDayOfWeek !== 6) {
                    businessDaysAdded++;
                }
            }
            
            return expiryDate;
        }

        // Function to calculate PnL
        function calculatePnL(alert) {
            if (!alert || !alert.ticker || !alert.alertPrice || !alert.currentPrice) return 0;
            
            let entryPrice = Number(alert.alertPrice);
            let currentPrice = Number(alert.currentPrice);
            
            if (isNaN(entryPrice) || isNaN(currentPrice) || entryPrice <= 0 || currentPrice <= 0) return 0;
            
            // Use performance.adjustedPercent (P&L) if available; otherwise calculate normally
            let returnPercent = null;
            if (alert.performance && typeof alert.performance.adjustedPercent === 'number') {
                returnPercent = alert.performance.adjustedPercent;
            } else {
                // Calculate normally without reverse split adjustments
                returnPercent = ((currentPrice - entryPrice) / entryPrice) * 100;
                const isShortForCalc = Array.isArray(alert.isShort) ? alert.isShort.length > 0 : (alert.isShort === true);
                if (isShortForCalc) returnPercent = -returnPercent;
            }
            
            const priceChangeElement = document.querySelector(`[data-ticker="${alert.ticker}"] .price-change`);
            
            if (priceChangeElement) {
                // Detect if short: check isShort array or position field
                const isShort = Array.isArray(alert.isShort) ? alert.isShort.length > 0 : (alert.position === 'short' || alert.isShort === true);
                const isDarkMode = document.body.classList.contains('dark-mode');
                
                if (isShort) {
                    // For shorts: negative price change is profit, positive change is loss
                    if (returnPercent > 0) {
                        priceChangeElement.style.color = isDarkMode ? '#ff3333' : '#ff0000';  // Red for loss
                    } else {
                        priceChangeElement.style.color = isDarkMode ? '#1fff1f' : '#00aa00';  // Green for profit
                    }
                    return returnPercent;  // For P&L, returnPercent is signed appropriately for shorts
                } else {
                    // For longs: positive change is profit, negative change is loss
                    if (returnPercent > 0) {
                        priceChangeElement.style.color = isDarkMode ? '#1fff1f' : '#00aa00';  // Green for profit
                    } else {
                        priceChangeElement.style.color = isDarkMode ? '#ff3333' : '#ff0000';  // Red for loss
                    }
                    return returnPercent;
                }
            }
            
            return 0;
        }

        // Utility functions for alerts
        function formatAlertAge(alertTime) {
            if (!alertTime) return 'Unknown';
            const now = new Date();
            const diff = now - alertTime;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            
            if (days > 0) return `${days}d ago`;
            if (hours > 0) return `${hours}h ago`;
            return `${minutes}m ago`;
        }

        function getLocationDisplay(location) {
            if (!location) return 'Unknown';
            const country = getCountryForFlag(location);
            const flag = COUNTRY_FLAG_MAP[country] || '';
            return `${flag} ${location}`;
        }

        function getMarketTimeWindow(date) {
            const nyDate = new Date(date.toLocaleString('en-US', { timeZone: 'America/New_York' }));
            const hours = nyDate.getHours();
            const minutes = nyDate.getMinutes();
            const time = hours * 100 + minutes;

            if (time < 930) return 'Pre-Market';
            if (time >= 930 && time <= 1600) return 'Market Hours';
            return 'After Hours';
        }

        function updateTimeDisplay() {
            const now = new Date();
            const nyTime = new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/New_York',
                hour: 'numeric',
                minute: 'numeric',
                second: 'numeric',
                hour12: true
            }).format(now);
            document.getElementById('time-display').textContent = nyTime + ' ET';
        }

        // Notification functions
        function toggleNotificationPanel(event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            const panel = document.getElementById('notification-panel');
            const isVisible = panel.style.display === 'block';

            // Only load alerts when opening, don't close dropdowns
            if (!isVisible) {
                loadRecentAlerts();
            }

            // Toggle panel visibility with animation
            if (!isVisible) {
                panel.style.display = 'block';
                panel.style.opacity = '0';
                panel.style.transform = 'translateY(-10px)';
                requestAnimationFrame(() => {
                    panel.style.opacity = '1';
                    panel.style.transform = 'translateY(0)';
                });
            } else {
                panel.style.opacity = '0';
                panel.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    panel.style.display = 'none';
                }, 200);
            }

            // Handle outside clicks
            if (!isVisible) {
                setTimeout(() => {
                    document.addEventListener('click', closeNotificationPanelOnClickOutside);
                }, 0);
            } else {
                document.removeEventListener('click', closeNotificationPanelOnClickOutside);
            }
        }

        function closeNotificationPanelOnClickOutside(event) {
            const panel = document.getElementById('notification-panel');
            const icon = document.querySelector('.notification-history-icon');
            if (!panel.contains(event.target) && !icon.contains(event.target)) {
                panel.style.display = 'none';
                document.removeEventListener('click', closeNotificationPanelOnClickOutside);
            }
        }

        function clearNotifications() {
            customConfirm('Clear all alerts?', null).then(confirmed => {
                if (confirmed) {
                    // Only clear the local cached recent alerts, do not delete the source alert.json file.
                    const recentList = document.getElementById('notification-list');
                    recentList.innerHTML = '';
                    const emptyState = document.createElement('div');
                    emptyState.style.cssText = 'padding: 20px; text-align: center; opacity: 0.6; font-size: 12px;';
                    emptyState.textContent = 'No alerts';
                    recentList.appendChild(emptyState);

                    // Mark the local cache as cleared and remove any stored recent alerts.
                    localStorage.removeItem('recentAlerts');
                    
                    // Update notification count and retain history/inbox data.
                    notifications = [];
                    updateNotificationCount();
                }
            });
        }

        function switchNotificationTab(tab) {
            const recentList = document.getElementById('notification-list');
            const historyList = document.getElementById('notification-history-list');
            const inboxList = document.getElementById('notification-inbox-list');
            const tabs = document.querySelectorAll('.notification-tab');
            
            tabs.forEach(t => {
                t.classList.remove('active');
                t.style.color = '#999';
            });
            
            if (tab === 'recent') {
                recentList.style.display = 'block';
                historyList.style.display = 'none';
                inboxList.style.display = 'none';
                tabs[0].classList.add('active');
                tabs[0].style.color = '';
                loadRecentAlerts();
            } else if (tab === 'history') {
                recentList.style.display = 'none';
                historyList.style.display = 'block';
                inboxList.style.display = 'none';
                tabs[1].classList.add('active');
                tabs[1].style.color = '';
                loadHistoryAlerts();
            } else if (tab === 'inbox') {
                recentList.style.display = 'none';
                historyList.style.display = 'none';
                inboxList.style.display = 'block';
                tabs[2].classList.add('active');
                tabs[2].style.color = '';
                loadInboxMessages();
            }
        }

        function loadRecentAlerts() {
            // Add cache bust to prevent stale alert.json from mobile cache
            const timestamp = Date.now();
            const alertUrl = new URL('/logs/alert.json', window.location.href);
            alertUrl.searchParams.set('t', timestamp);
            const fallbackUrl = `https://raw.githubusercontent.com/heyitshurberto/mobile/main/logs/alert.json?t=${timestamp}`;
            const stockFallbackUrl = new URL('/logs/stocks.json', window.location.href);
            stockFallbackUrl.searchParams.set('t', timestamp);

            const parseJsonResponse = (response) => {
                if (!response.ok) {
                    throw new Error(`Fetch failed: ${response.status}`);
                }
                return response.json();
            };

            fetch(alertUrl, { cache: 'no-store' })
                .then(parseJsonResponse)
                .catch(() => {
                    console.warn('alert.json fetch failed, trying stocks.json fallback');
                    return fetch(stockFallbackUrl, { cache: 'no-store' });
                })
                .then(result => {
                    if (result instanceof Response) {
                        return parseJsonResponse(result);
                    }
                    return result;
                })
                .then(alerts => {
                    if (!alerts || !Array.isArray(alerts) || alerts.length === 0) {
                        console.warn('alert.json empty, trying GitHub fallback');
                        return fetch(fallbackUrl, { cache: 'no-store' })
                            .then(parseJsonResponse)
                            .catch(() => {
                                console.warn('GitHub fallback failed, using stocks.json fallback');
                                return fetch(stockFallbackUrl, { cache: 'no-store' }).then(parseJsonResponse);
                            });
                    }
                    return alerts;
                })
                .then(alerts => {
                    if (!alerts) throw new Error('No alerts data');
                    
                    const list = document.getElementById('notification-list');
                    list.innerHTML = '';
                    
                    if (!Array.isArray(alerts) || alerts.length === 0) {
                        if (!isMobileLandscape()) {
                            const emptyState = document.createElement('div');
                            emptyState.classList.add('empty-state');
                            emptyState.style.cssText = 'padding: 20px; text-align: center; opacity: 0.6; font-size: 12px;';
                            emptyState.textContent = 'No recent alerts';
                            list.appendChild(emptyState);
                        }
                        updateNotificationCount();
                        return;
                    }
                    
                    // Update notifications array for badge count
                    notifications = alerts;
                    updateNotificationCount();
                    
                    alerts.slice(-20).reverse().forEach(alert => {
                        const item = document.createElement('div');
                        item.className = 'notification-item';
                        item.style.cursor = 'pointer';
                        const date = new Date(alert.recordedAt || alert.timestamp || alert.date || new Date().toISOString());
                        const dateStr = date.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: '2-digit' });
                        const timeStr = date.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
                        const marketCapStr = alert.marketCap && alert.marketCap !== 'N/A' ? '$' + parseFloat(alert.marketCap).toLocaleString() : 'N/A';
                        const ftdStr = alert.ftd !== false && alert.ftd !== null && alert.ftd !== undefined && alert.ftd !== 'False'
                            ? (typeof alert.ftd === 'number' ? alert.ftd.toLocaleString() : alert.ftd)
                            : 'False';
                        let insiderStr = 'N/A';
                        if (alert.insiderPercent && alert.insiderPercent !== 'N/A') {
                            const insiderVal = parseFloat(alert.insiderPercent) * 100;
                            insiderStr = !isNaN(insiderVal) ? insiderVal.toFixed(2) + '%' : 'N/A';
                        }
                        
                        const secLink = `https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${alert.cik}&type=6-K&dateb=&owner=exclude&count=100`;
                        const saLink = `https://www.stockanalysis.com/stocks/${alert.ticker.toLowerCase()}/`;
                        const direction = alert.isShort ? 'SHORT' : 'LONG';
                        const companyName = alert.companyName || alert.name || 'N/A';
                        const sectorText = alert.sector && alert.sector !== 'N/A' ? alert.sector : 'N/A';
                        
                        item.innerHTML = `
                            <div style="margin-bottom: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
                                <span style="text-decoration: underline;">
                                    $${alert.ticker} <span style="opacity: 0.7; font-weight: 400;">(${companyName})</span> <i style="font-weight: 700;">${direction}</i> @ $${alert.price}
                                </span>
                                <span style="font-size: 10px; opacity: 0.5; font-style: italic; font-weight: bold; white-space: nowrap;">Date: ${dateStr} ${timeStr} UTC</span>
                            </div>
                            <div style="font-size: 11px; opacity: 0.77; margin-bottom: 4px;">Sector: ${sectorText} | Market Cap: ${marketCapStr} | FTD: ${ftdStr} | F/AV: ${alert.fav}x</div>
                        `;
                        
                        item.addEventListener('click', () => {
                            customConfirm(`View details for <b><i>$${alert.ticker}</i></b>?`, `${saLink}`);
                        });
                        
                        list.appendChild(item);
                    });
                })
                .catch(e => {
                    console.error('Failed to load alerts:', e);
                    const list = document.getElementById('notification-list');
                    list.innerHTML = '';
                    const emptyState = document.createElement('div');
                    emptyState.style.cssText = 'padding: 20px; text-align: center; opacity: 0.6; font-size: 12px;';
                    emptyState.textContent = 'Error loading alerts';
                    list.appendChild(emptyState);
                    // Update notification count even on error
                    updateNotificationCount();
                });
        }

        function loadHistoryAlerts() {
            const stockUrl = '/logs/stocks.json';
            const quoteUrl = '/logs/quote.json';
            
            Promise.all([
                fetch(stockUrl).then(r => r.ok ? r : fetch('https://raw.githubusercontent.com/heyitshurberto/sysd/main/logs/stocks.json')).then(r => r.json()),
                fetch(quoteUrl).then(r => r.ok ? r.json() : {}).catch(() => ({}))
            ])
                .then(([stocks, quotes]) => {
                    const list = document.getElementById('notification-history-list');
                    if (!list) {
                        console.error('History list element not found');
                        return;
                    }
                    list.innerHTML = '';
                    
                    if (!stocks || !Array.isArray(stocks) || stocks.length === 0) {
                        const emptyState = document.createElement('div');
                        emptyState.style.cssText = 'padding: 20px; text-align: center; opacity: 0.6; font-size: 12px;';
                        emptyState.textContent = 'No history available';
                        list.appendChild(emptyState);
                        return;
                    }
                    
                    // Calculate all-time performance
                    let totalPL = 0;
                    let totalTrades = 0;
                    let winningTrades = 0;
                    
                    stocks.forEach(stock => {
                        const alertPrice = parseFloat(stock.price);
                        const isShort = stock.isShort === true;
                        const quoteData = quotes[stock.ticker] || {};
                        
                        let peakPercent = 0;
                        if (alertPrice > 0) {
                            // Use live quote data if available, otherwise fall back to stored percentages
                            const highest = parseFloat(quoteData.highest || stock.highest5Day || stock.price);
                            const lowest = parseFloat(quoteData.lowest || stock.lowest5Day || stock.price);
                            let highPercent = ((highest - alertPrice) / alertPrice) * 100;
                            const lowPercent = ((alertPrice - lowest) / alertPrice) * 100;
                            if (isShort) {
                                // For shorts, an upward move is a loss, so keep the sign negative.
                                highPercent = -highPercent;
                            }
                            peakPercent = Math.abs(highPercent) >= Math.abs(lowPercent) ? highPercent : lowPercent;
                        }
                        
                        if (!isNaN(peakPercent)) {
                            totalTrades++;
                            totalPL += peakPercent;
                            if (peakPercent > 0) winningTrades++;
                        }
                    });
                    
                    const avgPerformance = totalTrades > 0 ? (totalPL / totalTrades).toFixed(2) : '0.00';
                    const winRate = totalTrades > 0 ? Math.round((winningTrades / totalTrades) * 100) : 0;
                    
                    // Add all-time calc stats header
                    const statsDiv = document.createElement('div');
                    const perfSign = parseFloat(avgPerformance) >= 0 ? '+' : '';
                    const perfColor = parseFloat(avgPerformance) > 0 ? '#00dd00' : parseFloat(avgPerformance) < 0 ? '#ff3333' : '#888';
                    statsDiv.style.cssText = `padding: 12px 14px; border-radius: 6px; margin-bottom: 12px; border-left: 4px solid #00aa00; cursor: pointer; transition: background-color 0.2s ease; pointer-events: auto; position: relative; z-index: 10;`;
                    statsDiv.innerHTML = `
                        <div style="font-size: 13px; font-weight: 600; margin-bottom: 6px;">
                            All-Time Return: <span style="color: ${perfColor}; font-style: italic;">${perfSign}${avgPerformance}%</span>
                        </div>
                        <div style="font-size: 10px; opacity: 0.96;">
                            Win Rate: <span style="color: ${perfColor}; font-style: italic;">${winRate}%</span> • Trades: ${winningTrades}W / ${totalTrades - winningTrades}L
                        </div>
                    `;
                    
                    // Add hover effect
                    statsDiv.addEventListener('mouseenter', () => {
                        const isDark = document.body.classList.contains('dark-mode');
                        statsDiv.style.backgroundColor = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.05)';
                    });
                    statsDiv.addEventListener('mouseleave', () => {
                        statsDiv.style.backgroundColor = '';
                    });
                    
                    // Make clickable to show detailed stats
                    statsDiv.addEventListener('click', (e) => {
                        try {
                            e.preventDefault();
                            e.stopPropagation();
                            console.log('Stats div clicked - opening modal with', {
                                totalTrades,
                                winningTrades,
                                avgPerformance,
                                stocksCount: stocks.length
                            });
                            if (typeof showDetailedStatsModal === 'function') {
                                showDetailedStatsModal(stocks, quotes, totalTrades, winningTrades, avgPerformance);
                            } else {
                                console.error('showDetailedStatsModal is not a function', typeof showDetailedStatsModal);
                            }
                        } catch (err) {
                            console.error('Error in stats click handler:', err);
                        }
                    });
                    
                    list.appendChild(statsDiv);
                    
                    stocks.slice().reverse().forEach(stock => {
                        const item = document.createElement('div');
                        item.className = 'notification-item';
                        item.style.cursor = 'pointer';
                        const date = new Date(stock.recordedAt);
                        const dateStr = date.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: '2-digit' });
                        const timeStr = date.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
                        
                        const saLink = `https://www.stockanalysis.com/stocks/${stock.ticker.toLowerCase()}/`;
                        const direction = stock.isShort ? 'SHORT' : 'LONG';
                        const companyName = stock.companyName || 'N/A';
                        
                        // Use live quote data for peak prices and percentages
                        const alertPrice = parseFloat(stock.price);
                        const isShortPos = stock.isShort === true;
                        const quoteData = quotes[stock.ticker] || {};
                        
                        let peakPrice = stock.price;
                        let peakPercent = 0;
                        
                        // Calculate days, hours and minutes remaining
                        let daysLeft = 0;
                        let hoursLeft = 0;
                        let minutesLeft = 0;
                        let expireText = 'N/A';
                        let expireLabel = '';
                        if (stock.expiresAt) {
                          const now = new Date();
                          const expiry = new Date(stock.expiresAt);
                          const msRemaining = expiry - now;
                          const expiryDate = expiry.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: '2-digit' });
                          const expiryTime = expiry.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
                          if (msRemaining > 0) {
                            daysLeft = Math.floor(msRemaining / (1000 * 60 * 60 * 24));
                            hoursLeft = Math.floor((msRemaining / (1000 * 60 * 60)) % 24);
                            minutesLeft = Math.floor((msRemaining / (1000 * 60)) % 60);
                            expireText = `${daysLeft}d ${hoursLeft}h ${minutesLeft}m`;
                            expireLabel = `Expires: ${expireText}`;
                          } else {
                            expireText = `Expired: ${expiryDate} ${expiryTime}`;
                            expireLabel = expireText;
                          }
                        }

                        const isExpired = stock.expiresAt && new Date() > new Date(stock.expiresAt);
                        
                        // Prefer backend-calculated peak values (which include manual overrides from overrides.json)
                        let useBackendPeak = false;
                        
                        if (stock.highest5Day !== undefined && stock.highest5DayPercent !== undefined) {
                            // Backend has calculated the peak (possibly from manual override)
                            const storedHigh = parseFloat(stock.highest5Day || stock.price);
                            const storedLow = parseFloat(stock.lowest5Day || stock.price);
                            let storedHighPercent = alertPrice > 0 ? ((storedHigh - alertPrice) / alertPrice) * 100 : 0;
                            const storedLowPercent = alertPrice > 0 ? ((alertPrice - storedLow) / alertPrice) * 100 : 0;
                            if (isShortPos) storedHighPercent = -storedHighPercent;
                            if (Math.abs(storedHighPercent) >= Math.abs(storedLowPercent)) {
                                peakPrice = storedHigh.toFixed(2);
                                peakPercent = storedHighPercent;
                            } else {
                                peakPrice = storedLow.toFixed(2);
                                peakPercent = storedLowPercent;
                            }
                            useBackendPeak = true;
                        } else if (isExpired) {
                            // For expired alerts, use stored peak values
                            const storedHigh = parseFloat(stock.highest5Day || stock.price);
                            const storedLow = parseFloat(stock.lowest5Day || stock.price);
                            let storedHighPercent = alertPrice > 0 ? ((storedHigh - alertPrice) / alertPrice) * 100 : 0;
                            const storedLowPercent = alertPrice > 0 ? ((alertPrice - storedLow) / alertPrice) * 100 : 0;
                            if (isShortPos) storedHighPercent = -storedHighPercent;
                            if (Math.abs(storedHighPercent) >= Math.abs(storedLowPercent)) {
                                peakPrice = storedHigh.toFixed(2);
                                peakPercent = storedHighPercent;
                            } else {
                                peakPrice = storedLow.toFixed(2);
                                peakPercent = storedLowPercent;
                            }
                        } else {
                            // Live updates for active alerts
                            const highest = parseFloat(quoteData.highest || stock.highest5Day || stock.price);
                            const lowest = parseFloat(quoteData.lowest || stock.lowest5Day || stock.price);
                            let highestPercent = alertPrice > 0 ? ((highest - alertPrice) / alertPrice) * 100 : 0;
                            const lowestPercent = alertPrice > 0 ? ((alertPrice - lowest) / alertPrice) * 100 : 0;
                            if (isShortPos) highestPercent = -highestPercent;
                            if (Math.abs(highestPercent) >= Math.abs(lowestPercent)) {
                                peakPrice = highest.toFixed(2);
                                peakPercent = highestPercent;
                            } else {
                                peakPrice = lowest.toFixed(2);
                                peakPercent = lowestPercent;
                            }
                        }
                        
                        // Format percentage with proper sign
                        const percentSign = peakPercent >= 0 ? '+' : '';
                        const peakDisplay = `Peak: $${peakPrice}   <b style="font-weight: 600;">${percentSign}${peakPercent.toFixed(2)}%</b> (${expireLabel})`;
                        
                        // Determine color based on position type and performance
                        // For SHORT: positive peakPercent = profit (green), negative = loss (red)
                        // For LONG: positive peakPercent = profit (green), negative = loss (red)
                        // peakPercent is already signed correctly for both SHORT and LONG

            const contentInput = document.getElementById('new-msg-content');
            const errorDiv = document.getElementById('msg-error');
            const yesBtn = document.getElementById('create-msg-yes');
            const noBtn = document.getElementById('create-msg-no');
            
            const cleanup = () => {
                modal.remove();
            };
            
            yesBtn.onclick = async () => {
                const title = titleInput.value.trim();
                const content = contentInput.value.trim();
                
                if (!title || !content) {
                    errorDiv.textContent = 'Please fill in both title and message';
                    errorDiv.style.display = 'block';
                    return;
                }
                
                errorDiv.style.display = 'none';
                yesBtn.disabled = true;
                yesBtn.textContent = 'Sending...';
                
                const storageKey = getInboxStorageKey();
                const messages = JSON.parse(localStorage.getItem(storageKey)) || [];
                messages.push({
                    title: title,
                    message: content,
                    timestamp: new Date().toISOString()
                });
                localStorage.setItem(storageKey, JSON.stringify(messages));
                
                // Send to configured email
                try {
                    const response = await fetch('/api/send-message', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, message: content })
                    });
                    
                    const result = await response.json();
                    
                    if (!response.ok || !result.success) {
                        throw new Error(result.error || 'Failed to send message');
                    }
                    
                    // Add notification alert
                    addToNotificationHistory(`Message sent: "${title}"`, 'success');
                    showMessageNotification(`Message sent: ${title}`, 'success');
                    
                    cleanup();
                    loadInboxMessages();
                } catch (err) {
                    errorDiv.textContent = `Failed to send message: ${err.message}`;
                    errorDiv.style.display = 'block';
                    yesBtn.disabled = false;
                    yesBtn.textContent = 'Send';
                }
            };
            
            noBtn.onclick = cleanup;
            
            titleInput.focus();
        }


        function deleteInboxMessage(idx) {
            const storageKey = getInboxStorageKey();
            const messages = JSON.parse(localStorage.getItem(storageKey)) || [];
            if (idx < 0 || idx >= messages.length) return;
            
            const msgTitle = messages[idx]?.title || 'Message';
            
            // Remove any existing modals first
            const existingModals = document.querySelectorAll('.custom-confirm-modal');
            existingModals.forEach(modal => modal.remove());
            
            const modal = document.createElement('div');
            modal.className = 'custom-confirm-modal';
            modal.style.zIndex = '999999999';
            
            const uniqueYesId = 'delete-msg-yes-' + Date.now();
            const uniqueNoId = 'delete-msg-no-' + Date.now();
            
            modal.innerHTML = `
                <div class="custom-confirm-box">
                    <div>Delete this message?</div>
                    <div class="custom-confirm-buttons">
                        <button type="button" class="custom-confirm-btn yes" id="${uniqueYesId}">Yes</button>
                        <button type="button" class="custom-confirm-btn no" id="${uniqueNoId}">No</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            const yesBtn = document.getElementById(uniqueYesId);
            const noBtn = document.getElementById(uniqueNoId);
            
            const cleanup = () => {
                modal.remove();
            };
            
            yesBtn.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                const storageKey = getInboxStorageKey();
                const messages = JSON.parse(localStorage.getItem(storageKey)) || [];
                messages.splice(idx, 1);
                localStorage.setItem(storageKey, JSON.stringify(messages));
                addToNotificationHistory(`Message deleted: "${msgTitle}"`, 'deleted');
                showMessageNotification(`Message deleted: ${msgTitle}`, 'deleted');
                cleanup();
                loadInboxMessages();
            };
            
            noBtn.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                cleanup();
            };
        }

        class AlertDashboard {
            constructor() {
                this.alerts = new Map(); // ticker -> single most recent alert
                this.updateInterval = 1000; // 1 second
                this.alertThreshold = 0.12; // 12%
                this.volumeThreshold = 1.3; // 1.3x average volume
                this.notifiedAlerts = new Map(); // Track notified alerts to prevent duplicates
                this.recentThreshold = 120000; // 2 minutes in milliseconds
                this.knownAlerts = new Set(); // Track known alerts by unique key (ticker-time)
                this.dataLoadStartTime = Date.now(); // Track when we started loading
                this.loadingTimeoutMs = 5000; // 5 seconds before showing 0.00% instead of Loading...

                // Track next +/- 10% milestone steps from original 12% alert
                // Map key: ticker, value: { upStep: number, downStep: number }
                this.milestones = new Map();

                // Remove loadInitialAlerts() from here - startMonitoring() will handle it
                this.startMonitoring();
            }
            
            async loadInitialAlerts() {
                try {
                    // Clear existing alerts and states
                    this.alerts.clear();
                    this.knownAlerts.clear();
                    
                    // Try local endpoint first (if available), fall back to GitHub raw content
                    let alertData = [];
                    let response;
                    
                    // Always try local endpoint first, regardless of hostname
                    const alertUrl = '/logs/alert.json';
                    
                    try {
                        response = await fetch(alertUrl);
                        if (!response.ok) {
                            console.error('Failed to fetch alert.json locally:', response.status, response.statusText);
                            // Fall back to GitHub if local fails
                            response = await fetch('https://raw.githubusercontent.com/heyitshurberto/sysd/main/logs/alert.json');
                        }
                        
                        if (response.ok) {
                            alertData = await response.json();
                        } else {
                            alertData = [];
                        }
                    } catch (err) {
                        console.error('Error fetching alerts locally, trying GitHub:', err.message);
                        // Fallback to GitHub
                        try {
                            const githubResponse = await fetch('https://raw.githubusercontent.com/heyitshurberto/mobile/main/logs/alert.json');
                            if (githubResponse.ok) {
                                alertData = await githubResponse.json();
                            } else {
                                alertData = [];
                            }
                        } catch (gitErr) {
                            console.error('GitHub fallback also failed:', gitErr.message);
                            alertData = [];
                        }
                    }
                    
                    smartLog('info', `Loaded ${alertData.length} alerts from alert.json`); // Log total count

                    // Filter out expired alerts first, then limit display to 12
                    const now = new Date();
                    const activeAlerts = alertData.filter(a => !a.expiresAt || new Date(a.expiresAt) > now);
                    smartLog('info', `${activeAlerts.length} alerts still active (${alertData.length - activeAlerts.length} expired)`);
                    const displayAlerts = activeAlerts.slice(-12);
                    let performanceData = {};
                    let stocksData = [];
                    try {
                        const quoteUrl = '/logs/quote.json';
                        const pnlResponse = await fetch(quoteUrl);
                        if (!pnlResponse.ok) {
                            // Fall back to GitHub
                            const githubResponse = await fetch('https://raw.githubusercontent.com/heyitshurberto/sysd/main/logs/quote.json');
                            if (githubResponse.ok) {
                                performanceData = await githubResponse.json();
                            }
                        } else {
                            performanceData = await pnlResponse.json();
                        }
                    } catch (err) {
                        smartLog('warn', `Could not load quote.json for performance data: ${err.message}`);
                    }

                    // Load stocks.json to get peak prices (highest5Day)
                    try {
                        const stockUrl = '/logs/stocks.json';
                        const stockResponse = await fetch(stockUrl);
                        if (!stockResponse.ok) {
                            // Fall back to GitHub
                            const githubResponse = await fetch('https://raw.githubusercontent.com/heyitshurberto/sysd/main/logs/stocks.json');
                            if (githubResponse.ok) {
                                stocksData = await githubResponse.json();
                            }
                        } else {
                            stocksData = await stockResponse.json();
                        }
                    } catch (err) {
                        smartLog('warn', `Could not load stocks.json for peak data: ${err.message}`);
                    }

                    // Process only the 12 most recent alerts in chronological order
                    displayAlerts.sort((a, b) => new Date(b.alertDate) - new Date(a.alertDate));

                    // Initialize monitoring for each alert
                    let loadedCount = 0;
                    let skippedCount = 0;
                    let errorCount = 0;

                    for (const alert of displayAlerts) {
                        try {
                            const price = parseFloat(alert.price);

                            if (!alert.ticker) {
                                smartLog('error', 'Alert missing ticker:', alert);
                                errorCount++;
                                continue;
                            }

                            if (isNaN(price) || price <= 0) {
                                smartLog('error', `Invalid price for ${alert.ticker}: ${alert.price}`);
                                errorCount++;
                                continue;
                            }

                            // Create unique key for this alert
                            const alertKey = `${alert.ticker}-${alert.alertDate}-${alert.price}`;

                            // Skip if already known
                            if (this.knownAlerts.has(alertKey)) {
                                skippedCount++;
                                continue;
                            }

                            // Convert recordedAt to actual Date object if it's a string
                            const alertTime = alert.recordedAt ? new Date(alert.recordedAt) : (alert.alertDate ? new Date(alert.alertDate) : new Date());

                            smartLog('info', `Processing alert for ${alert.ticker} at $${price}`);

                            const sharesOut = parseInt(alert.sharesOutstanding) || 0;
                            const floatShares = parseInt(alert.float) || 0;
                            const mcap = alert.marketCap ? parseFloat(alert.marketCap) : (price * sharesOut);
                            const fiveDay = alert.fiveDChange ? parseFloat(alert.fiveDChange) : 0;

                            // Calculate S/O ratio as percentage (float / shares outstanding)
                            let soRatio = 'N/A';
                            if (floatShares > 0 && sharesOut > 0) {
                              const ratio = (floatShares / sharesOut) * 100;
                              soRatio = ratio < 100 ? ratio.toFixed(2) + '%' : ratio.toFixed(1) + '%';
                            }

                            // Get performance data for this ticker if available
                            const tickerPerfData = performanceData[alert.ticker] || {};
                            
                            // Get peak price from stocks.json if available
                            const stockRecord = stocksData.find(s => s.ticker === alert.ticker);
                            const peakPriceFromStock = stockRecord && stockRecord.highest5Day ? parseFloat(stockRecord.highest5Day) : null;
                            
                            this.addAlert({
                                ticker: alert.ticker,
                                title: alert.title,
                                companyName: alert.companyName || 'N/A',
                                alertPrice: price,
                                currentPrice: tickerPerfData.currentPrice || price, // Use live price from quote.json, fallback to alert price
                                alertTime: alertTime,
                                incorporated: alert.incorporated || 'Unknown',
                                located: alert.located || 'Unknown',
                                sector: stockRecord?.sector || alert.sector || 'N/A',
                                signalScore: parseFloat(alert.signalScore) || 5.0,
                                isShort: Array.isArray(alert.isShort) ? alert.isShort.length > 0 : (alert.isShort === true),
                                exchange: alert.exchange || 'NASDAQ',
                                float: parseInt(alert.float) || 0,
                                sharesOutstanding: parseInt(alert.sharesOutstanding) || 0,
                                soRatio: soRatio,
                                ftd: alert.ftd !== undefined ? alert.ftd : false,
                                ftdPercent: alert.ftdPercent || null,
                                filingLink: alert.filingLink || '#',
                                signals: alert.signals || {},
                                bonusSignals: alert.bonusSignals || {},
                                intent: alert.intent || null,
                                currentVolume: parseInt(alert.volume) || 0,
                                volume: parseInt(alert.volume) || 0,
                                averageVolume: parseInt(alert.averageVolume) || 0,
                                marketCap: mcap > 0 ? mcap : null,
                                fiveDChange: !isNaN(fiveDay) ? fiveDay : null,
                                intent: alert.intent || null,
                                bonusSignals: alert.bonusSignals || {},
                                performance: tickerPerfData.performance,
                                reverseSplitRatio: tickerPerfData.reverseSplitRatio || alert.reverseSplitRatio || null, // From quote.json or alert.json
                                reverseSplitReason: alert.reverseSplitReason || null, // From alert.json
                                peakPrice: peakPriceFromStock || tickerPerfData.peakPrice || price,
                                stockPeakPrice: peakPriceFromStock || tickerPerfData.peakPrice || price, // Preserve original peak from stocks.json
                                lowPrice: peakPriceFromStock || tickerPerfData.lowPrice || price,
                                priceChange: (price - price) / price || 0,
                                hasTuesdayBonus: alert.hasTuesdayBonus || false,
                                custodianName: alert.custodianName || null,
                                custodianVerified: alert.custodianVerified || false,
                                filingTimeBonus: alert.filingTimeBonus || null,
                                soBonus: alert.soBonus || null,
                                formType: alert.formType || null,
                                weightedAverage: alert.wa || null,

            async checkForNewAlerts() {
                try {
                    // Always try local endpoint first
                    const alertUrl = '/logs/alert.json';
                    
                    let response;
                    try {
                        response = await fetch(alertUrl);
                        if (!response.ok) {
                            // Fall back to GitHub if local fails
                            response = await fetch('https://raw.githubusercontent.com/heyitshurberto/mobile/main/logs/alert.json');
                        }
                    } catch (err) {
                        console.error('Error fetching new alerts:', err.message);
                        return;
                    }
                    
                    if (!response.ok) {
                        console.error('Failed to fetch alert.json for updates:', response.status, response.statusText);
                        return;
                    }
                    const alertData = await response.json();

                    // Filter out expired alerts and get only the 12 most recent (syncing with backend cap)
                    const now = new Date();
                    const activeAlerts = alertData.filter(a => !a.expiresAt || new Date(a.expiresAt) > now);
                    const recentAlerts = activeAlerts.slice(-12);
                    
                    // Build a set of tickers currently in the file for removal detection
                    const fileTickersSet = new Set();
                    const newAlertCards = [];

                    // Process alerts from the file
                    for (const alert of recentAlerts) {
                        const alertKey = `${alert.ticker}-${alert.alertDate}-${alert.price}`;
                        fileTickersSet.add(alert.ticker);
                        
                        // Check if this alert already exists in our Map
                        let existingAlert = null;
                        if (this.alerts.has(alert.ticker)) {
                            const tickerAlerts = this.alerts.get(alert.ticker);
                            existingAlert = tickerAlerts.find(a => a.ticker === alert.ticker && a.alertDate === alert.alertDate);
                        }
                        
                        if (existingAlert) {
                            // Alert exists - preserve all tracking data, just update basic fields from file
                            existingAlert.expiresAt = alert.expiresAt;
                            existingAlert.price = alert.price;
                            existingAlert.title = alert.title;
                            existingAlert.signals = alert.signals;
                            // DON'T touch: currentPrice, priceChange, peakPrice, lowPrice, performance
                        } else {
                            // NEW alert we haven't seen before
                            const isNewAlert = !this.knownAlerts.has(alertKey);
                            
                            if (isNewAlert) {
                                this.knownAlerts.add(alertKey);
                                
                                // Create new alert object
                                const newAlert = {
                                    ...alert,
                                    currentPrice: alert.price,
                                    alertPrice: parseFloat(alert.price),
                                    alertTime: alert.recordedAt ? new Date(alert.recordedAt) : new Date(),
                                    peakPrice: parseFloat(alert.price),
                                    lowPrice: parseFloat(alert.price),
                                    priceChange: 0,
                                    volumeSpike: false,
                                    triggered: false
                                };

                                // Add to alerts map (keyed by ticker)
                                if (!this.alerts.has(alert.ticker)) {
                                    this.alerts.set(alert.ticker, []);
                                }
                                this.alerts.get(alert.ticker).push(newAlert);
                                
                                const alertCard = this.createAlertCard(newAlert);
                                newAlertCards.push(alertCard);
                                
                                // Show notification for new alerts
                                if (parseFloat(alert.signalScore) > 0.01) {
                                    const position = Array.isArray(alert.isShort) ? (alert.isShort.length > 0 ? 'SHORT' : 'LONG') : (alert.isShort ? 'SHORT' : 'LONG');
                                    const type = alert.isShort ? 'error' : 'success';
                                    const ticker = `<b>$${alert.ticker}</b>`;
                                    this.showNotification(`${ticker} ${position}`, type, alert.filingLink || '#');
                                }
                                
                                smartLog('info', `New ticker found in alert.json: ${alert.ticker} @ $${alert.price}`);
                            }
                        }
                    }

                    // Remove tickers that are no longer in the file (expired or removed by backend)
                    const tickersToRemove = [];
                    for (const [ticker, alerts] of this.alerts) {
                        if (!fileTickersSet.has(ticker)) {
                            tickersToRemove.push(ticker);
                        }
                    }
                    
                    // Remove expired tickers
                    let hadRemovals = tickersToRemove.length > 0;
                    tickersToRemove.forEach(ticker => {
                        this.alerts.delete(ticker);
                        smartLog('info', `Removing expired ticker: ${ticker}`);
