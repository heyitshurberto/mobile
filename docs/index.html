<script>
function updateLogoDarkMode() {
  const isDarkMode = document.body.classList.contains('dark-mode');
  const teleIcon = document.getElementById('tele-logo');
  const xIcon = document.getElementById('x-logo');
  if (teleIcon) teleIcon.style.filter = isDarkMode ? 'brightness(0) saturate(100%) invert(100%)' : 'brightness(0) saturate(100%)';
  if (xIcon) xIcon.style.filter = isDarkMode ? 'brightness(0) saturate(100%) invert(100%)' : 'brightness(0) saturate(100%)';
}
// Call on load and when theme changes
window.addEventListener('load', updateLogoDarkMode);
document.addEventListener('themechanged', updateLogoDarkMode);
// Also observe dark-mode class changes
const observer = new MutationObserver(() => updateLogoDarkMode());
observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
</script>

    <script>

    // Custom confirm modal for all links
    function customConfirm(message, url) {
        return new Promise((resolve) => {
            // Remove any existing modals
            const existingModals = document.querySelectorAll('.custom-confirm-modal');
            existingModals.forEach(modal => modal.remove());

            const modal = document.createElement('div');
            modal.className = 'custom-confirm-modal';
            modal.style.zIndex = '999999999';
            modal.innerHTML = `
                <div class="custom-confirm-box">
                    <div>${message}</div>
                    <div class="custom-confirm-buttons">
                        <button type="button" class="custom-confirm-btn yes" id="custom-confirm-yes">Yes</button>
                        <button type="button" class="custom-confirm-btn no" id="custom-confirm-no">No</button>
                    </div>
                </div>
            `;
            
            const cleanup = () => {
                modal.remove();
                document.removeEventListener('keydown', handleKeyboard);
                document.removeEventListener('click', handleModalClick);
            };

            const handleYes = (e) => {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                cleanup();
                if (url) {
                    window.open(url, '_blank');
                }
                resolve(true);
            };

            const handleNo = (e) => {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                cleanup();
                resolve(false);
            };

            const handleKeyboard = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleYes(e);
                }
                if (e.key === 'Escape') {
                    e.preventDefault();
                    handleNo(e);
                }
            };

            const handleModalClick = (e) => {
                if (e.target === modal) {
                    e.preventDefault();
                    handleNo(e);
                }
            };

            // Attach event listeners with proper cleanup
            const yesButton = modal.querySelector('#custom-confirm-yes');
            const noButton = modal.querySelector('#custom-confirm-no');
            
            yesButton.addEventListener('click', handleYes);
            noButton.addEventListener('click', handleNo);
            modal.addEventListener('click', handleModalClick);
            document.addEventListener('keydown', handleKeyboard);
            
            // Add modal to document
            document.body.appendChild(modal);
            
            // Focus Yes button
            requestAnimationFrame(() => {
                yesButton.focus();
            });
        });
    }

    function getTradingViewSymbol(ticker, exchange) {

        console.log('getTradingViewSymbol:', { ticker, exchange });
        return ticker;
    }

    // Console filter to suppress DNS resolution logs for www.sec.gov
    (function() {
        const originalLog = console.log;
        const originalInfo = console.info;
        const originalWarn = console.warn;
        const originalError = console.error;

        function shouldFilter(message) {
            return typeof message === 'string' && message.includes('DNS resolved www.sec.gov');
        }

        console.log = function(...args) {
            if (!shouldFilter(args.join(' '))) {
                originalLog.apply(console, args);
            }
        };

        console.info = function(...args) {
            if (!shouldFilter(args.join(' '))) {
                originalInfo.apply(console, args);
            }
        };

        console.warn = function(...args) {
            if (!shouldFilter(args.join(' '))) {
                originalWarn.apply(console, args);
            }
        };

        console.error = function(...args) {
            if (!shouldFilter(args.join(' '))) {
                originalError.apply(console, args);
            }
        };
    })();

    <script>
        // Function to identify short setups
        function isShortSetup(alert) {
            // First check if alert has isShort or short property set
            if (alert.isShort === true || alert.short === true) return true;
            if (alert.isShort === false || alert.short === false) return false;
            
            if (!alert || !alert.intent) return false;
            
            // Check for primary short signals
            const hasReverseSplit = alert.intent.includes("Reverse Split");
            const hasBankruptcy = alert.intent.includes("Bankruptcy/Insolvency");
            const hasDilution = alert.intent.includes("Dilution");
            const hasGoingPrivate = alert.intent.includes("Going Private");
            
            // Short setup conditions in order of priority
            if (hasBankruptcy) return true; // Bankruptcy is always a short
            if (hasGoingPrivate) return true; // Going private low-ball offer is always a short
            if (hasReverseSplit && hasDilution) return true; // Reverse split + dilution combo
            if (hasReverseSplit) return true; // Any reverse split
            if (hasDilution && alert.intent.length === 1) return true; // Pure dilution with no other bullish signals
            
            // Consider a combination of dilution with other bearish signals
            if (hasDilution && alert.intent.some(signal => 
                signal.includes("Desperation") || 
                signal.includes("Bankruptcy") || 
                signal.includes("Insolvency"))) {
                return true;
            }
            
            return false;
        }

        // Function to calculate PnL
        function calculatePnL(alert) {
            if (!alert || !alert.ticker || !alert.alertPrice || !alert.currentPrice) return 0;
            
            let entryPrice = Number(alert.alertPrice);
            let currentPrice = Number(alert.currentPrice);
            
            if (isNaN(entryPrice) || isNaN(currentPrice) || entryPrice <= 0 || currentPrice <= 0) return 0;
            
            // Use performance.adjustedPercent (P&L) if available; otherwise calculate normally
            let returnPercent = null;
            if (alert.performance && typeof alert.performance.adjustedPercent === 'number') {
                returnPercent = alert.performance.adjustedPercent;
            } else {
                // Calculate normally without reverse split adjustments
                returnPercent = ((currentPrice - entryPrice) / entryPrice) * 100;
                const isShortForCalc = Array.isArray(alert.isShort) ? alert.isShort.length > 0 : (alert.isShort === true);
                if (isShortForCalc) returnPercent = -returnPercent;
            }
            
            const priceChangeElement = document.querySelector(`[data-ticker="${alert.ticker}"] .price-change`);
            
            if (priceChangeElement) {
                // Detect if short: check isShort array or position field
                const isShort = Array.isArray(alert.isShort) ? alert.isShort.length > 0 : (alert.position === 'short' || alert.isShort === true);
                const isDarkMode = document.body.classList.contains('dark-mode');
                
                if (isShort) {
                    // For shorts: negative price change is profit, positive change is loss
                    if (returnPercent > 0) {
                        priceChangeElement.style.color = isDarkMode ? '#ff3333' : '#ff0000';  // Red for loss
                    } else {
                        priceChangeElement.style.color = isDarkMode ? '#1fff1f' : '#00aa00';  // Green for profit
                    }
                    return returnPercent;  // For P&L, returnPercent is signed appropriately for shorts
                } else {
                    // For longs: positive change is profit, negative change is loss
                    if (returnPercent > 0) {
                        priceChangeElement.style.color = isDarkMode ? '#1fff1f' : '#00aa00';  // Green for profit
                    } else {
                        priceChangeElement.style.color = isDarkMode ? '#ff3333' : '#ff0000';  // Red for loss
                    }
                    return returnPercent;
                }
            }
            
            return 0;
        }

        // Utility functions for alerts
        function formatAlertAge(alertTime) {
            if (!alertTime) return 'Unknown';
            const now = new Date();
            const diff = now - alertTime;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            
            if (days > 0) return `${days}d ago`;
            if (hours > 0) return `${hours}h ago`;
            return `${minutes}m ago`;
        }

        function getLocationDisplay(location) {
            if (!location) return 'Unknown';
            const country = getCountryForFlag(location);
            const flag = COUNTRY_FLAG_MAP[country] || '';
            return `${flag} ${location}`;
        }

        function getMarketTimeWindow(date) {
            const nyDate = new Date(date.toLocaleString('en-US', { timeZone: 'America/New_York' }));
            const hours = nyDate.getHours();
            const minutes = nyDate.getMinutes();
            const time = hours * 100 + minutes;

            if (time < 930) return 'Pre-Market';
            if (time >= 930 && time <= 1600) return 'Market Hours';
            return 'After Hours';
        }

        function updateTimeDisplay() {
            const now = new Date();
            const nyTime = new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/New_York',
                hour: 'numeric',
                minute: 'numeric',
                second: 'numeric',
                hour12: true
            }).format(now);
            document.getElementById('time-display').textContent = nyTime + ' ET';
        }

        // Notification functions
        function toggleNotificationPanel(event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            const panel = document.getElementById('notification-panel');
            const isVisible = panel.style.display === 'block';

            // Only load alerts when opening, don't close dropdowns
            if (!isVisible) {
                loadRecentAlerts();
            }

            // Toggle panel visibility with animation
            if (!isVisible) {
                panel.style.display = 'block';
                panel.style.opacity = '0';
                panel.style.transform = 'translateY(-10px)';
                requestAnimationFrame(() => {
                    panel.style.opacity = '1';
                    panel.style.transform = 'translateY(0)';
                });
            } else {
                panel.style.opacity = '0';
                panel.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    panel.style.display = 'none';
                }, 200);
            }

            // Handle outside clicks
            if (!isVisible) {
                setTimeout(() => {
                    document.addEventListener('click', closeNotificationPanelOnClickOutside);
                }, 0);
            } else {
                document.removeEventListener('click', closeNotificationPanelOnClickOutside);
            }
        }

        function closeNotificationPanelOnClickOutside(event) {
            const panel = document.getElementById('notification-panel');
            const icon = document.querySelector('.notification-history-icon');
            if (!panel.contains(event.target) && !icon.contains(event.target)) {
                panel.style.display = 'none';
                document.removeEventListener('click', closeNotificationPanelOnClickOutside);
            }
        }

        function clearNotifications() {
            customConfirm('Clear all alerts?', null).then(confirmed => {
                if (confirmed) {
                    // Send request to clear alerts on server
                    fetch('/api/clear-alerts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    }).then(res => res.json()).then(data => {
                        // Clear all notification lists
                        const recentList = document.getElementById('notification-list');
                        const historyList = document.getElementById('notification-history-list');
                        const inboxList = document.getElementById('notification-inbox-list');
                        
                        [recentList, historyList, inboxList].forEach(list => {
                            list.innerHTML = '';
                            const emptyState = document.createElement('div');
                            emptyState.style.cssText = 'padding: 20px; text-align: center; opacity: 0.6; font-size: 12px;';
                            emptyState.textContent = 'No alerts';
                            list.appendChild(emptyState);
                        });
                        
                        // Clear local storage
                        localStorage.removeItem('recentAlerts');
                        localStorage.removeItem('alertHistory');
                        
                        // Reload the page after 200ms to refresh everything
                        setTimeout(() => {
                            location.reload();
                        }, 200);
                    }).catch(err => console.error('Error clearing alerts:', err));
                }
            });
        }

        function switchNotificationTab(tab) {
            const recentList = document.getElementById('notification-list');
            const historyList = document.getElementById('notification-history-list');
            const inboxList = document.getElementById('notification-inbox-list');
            const tabs = document.querySelectorAll('.notification-tab');
            
            tabs.forEach(t => {
                t.classList.remove('active');
                t.style.color = '#999';
            });
            
            if (tab === 'recent') {
                recentList.style.display = 'block';
                historyList.style.display = 'none';
                inboxList.style.display = 'none';
                tabs[0].classList.add('active');
                tabs[0].style.color = '';
                loadRecentAlerts();
            } else if (tab === 'history') {
                recentList.style.display = 'none';
                historyList.style.display = 'block';
                inboxList.style.display = 'none';
                tabs[1].classList.add('active');
                tabs[1].style.color = '';
                loadHistoryAlerts();
            } else if (tab === 'inbox') {
                recentList.style.display = 'none';
                historyList.style.display = 'none';
                inboxList.style.display = 'block';
                tabs[2].classList.add('active');
                tabs[2].style.color = '';
                loadInboxMessages();
            }
        }

        function loadRecentAlerts() {
            const alertUrl = '/logs/alert.json';
            
            fetch(alertUrl)
                .then(r => {
                    if (!r.ok) {
                        // Fall back to GitHub
                        return fetch('https://raw.githubusercontent.com/heyitshurberto/mobile/main/logs/alert.json');
                    }
                    return r;
                })
                .then(r => r.json())
                .then(alerts => {
                    const list = document.getElementById('notification-list');
                    list.innerHTML = '';
                    
                    if (!alerts || !Array.isArray(alerts) || alerts.length === 0) {
                        const emptyState = document.createElement('div');
                        emptyState.style.cssText = 'padding: 20px; text-align: center; opacity: 0.6; font-size: 12px;';
                        emptyState.textContent = 'No recent alerts';
                        list.appendChild(emptyState);
                        // Update notification count even if no alerts
                        updateNotificationCount();
                        return;
                    }
                    
                    // Update notifications array for badge count
                    notifications = alerts;
                    updateNotificationCount();
                    
                    alerts.slice(-20).reverse().forEach(alert => {
                        const item = document.createElement('div');
                        item.className = 'notification-item';
                        item.style.cursor = 'pointer';
                        const date = new Date(alert.recordedAt);
                        const dateStr = date.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: '2-digit' });
                        const timeStr = date.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
                        const floatStr = alert.float && alert.float !== 'N/A' ? (alert.float / 1000000).toFixed(2) + 'm' : 'N/A';
                        const soStr = alert.soRatio || 'N/A';
                        let insiderStr = 'N/A';
                        if (alert.insiderPercent && alert.insiderPercent !== 'N/A') {
                            const insiderVal = parseFloat(alert.insiderPercent) * 100;
                            insiderStr = !isNaN(insiderVal) ? insiderVal.toFixed(2) + '%' : 'N/A';
                        }
                        
                        const secLink = `https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${alert.cik}&type=6-K&dateb=&owner=exclude&count=100`;
                        const saLink = `https://www.stockanalysis.com/stocks/${alert.ticker.toLowerCase()}/`;
                        const direction = alert.isShort ? 'SHORT' : 'LONG';

        function loadHistoryAlerts() {
            const stockUrl = '/logs/stocks.json';
            const quoteUrl = '/logs/quote.json';
            
            Promise.all([
                fetch(stockUrl).then(r => r.ok ? r : fetch('https://raw.githubusercontent.com/heyitshurberto/sysd/main/logs/stocks.json')).then(r => r.json()),
                fetch(quoteUrl).then(r => r.ok ? r.json() : {}).catch(() => ({}))
            ])
                .then(([stocks, quotes]) => {
                    const list = document.getElementById('notification-history-list');
                    list.innerHTML = '';
                    
                    if (!stocks || !Array.isArray(stocks) || stocks.length === 0) {
                        const emptyState = document.createElement('div');
                        emptyState.style.cssText = 'padding: 20px; text-align: center; opacity: 0.6; font-size: 12px;';
                        emptyState.textContent = 'No history available';
                        list.appendChild(emptyState);
                        return;
                    }
                    
                    // Calculate all-time performance
                    let totalPL = 0;
                    let totalTrades = 0;
                    let winningTrades = 0;
                    
                    stocks.forEach(stock => {
                        const alertPrice = parseFloat(stock.price);
                        const isShort = stock.isShort === true;
                        const quoteData = quotes[stock.ticker] || {};
                        
                        let peakPercent = 0;
                        if (alertPrice > 0) {
                            // Use live quote data if available, otherwise fall back to stored percentages
                            const highest = parseFloat(quoteData.highest || stock.highest5Day || stock.price);
                            const lowest = parseFloat(quoteData.lowest || stock.lowest5Day || stock.price);
                            
                            if (isShort) {
                                // SHORT profit = (alertPrice - lowestPrice) / alertPrice * 100
                                peakPercent = ((alertPrice - lowest) / alertPrice) * 100;
                            } else {
                                // LONG profit = (highestPrice - alertPrice) / alertPrice * 100
                                peakPercent = ((highest - alertPrice) / alertPrice) * 100;
                            }
                        }
                        
                        if (!isNaN(peakPercent)) {
                            totalTrades++;
                            totalPL += peakPercent;
                            if (peakPercent > 0) winningTrades++;
                        }
                    });
                    
                    const avgPerformance = totalTrades > 0 ? (totalPL / totalTrades).toFixed(2) : '0.00';
                    const winRate = totalTrades > 0 ? Math.round((winningTrades / totalTrades) * 100) : 0;
                    
                    // Add all-time calc stats header
                    const statsDiv = document.createElement('div');
                    const perfSign = parseFloat(avgPerformance) >= 0 ? '+' : '';
                    const perfColor = parseFloat(avgPerformance) > 0 ? '#00dd00' : parseFloat(avgPerformance) < 0 ? '#ff3333' : '#888';
                    statsDiv.style.cssText = `padding: 12px 14px; border-radius: 6px; margin-bottom: 12px; border-left: 4px solid #00aa00;`;
                    statsDiv.innerHTML = `
                        <div style="font-size: 13px; font-weight: 600; margin-bottom: 6px;">
                            All-Time Return: <span style="color: ${perfColor}; font-style: italic;">${perfSign}${avgPerformance}%</span>
                        </div>
                        <div style="font-size: 10px; opacity: 0.96;">
                            Win Rate: <span style="color: ${perfColor}; font-style: italic;">${winRate}%</span> • Trades: ${winningTrades}W / ${totalTrades - winningTrades}L
                        </div>
                    `;
                    list.appendChild(statsDiv);
                    
                    stocks.slice().reverse().forEach(stock => {
                        const item = document.createElement('div');
                        item.className = 'notification-item';
                        item.style.cursor = 'pointer';
                        const date = new Date(stock.recordedAt);
                        const dateStr = date.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: '2-digit' });
                        const timeStr = date.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
                        
                        const saLink = `https://www.stockanalysis.com/stocks/${stock.ticker.toLowerCase()}/`;
                        const direction = stock.isShort ? 'SHORT' : 'LONG';
                        
                        // Use live quote data for peak prices and percentages
                        const alertPrice = parseFloat(stock.price);
                        const isShortPos = stock.isShort === true;
                        const quoteData = quotes[stock.ticker] || {};
                        
                        let peakPrice = stock.price;
                        let peakPercent = 0;
                        
                        if (isShortPos) {
                            // SHORT: lowest price is best outcome (profit)
                            const lowest = parseFloat(quoteData.lowest || stock.lowest5Day || stock.price);
                            peakPrice = lowest.toFixed(2);
                            peakPercent = alertPrice > 0 ? ((alertPrice - lowest) / alertPrice) * 100 : 0;
                        } else {
                            // LONG: check highest first, but if that's 0% or equal to alert, show the worst case (lowest)
                            const highest = parseFloat(quoteData.highest || stock.highest5Day || stock.price);
                            const lowest = parseFloat(quoteData.lowest || stock.lowest5Day || stock.price);
                            
                            let highestPercent = alertPrice > 0 ? ((highest - alertPrice) / alertPrice) * 100 : 0;
                            let lowestPercent = alertPrice > 0 ? ((lowest - alertPrice) / alertPrice) * 100 : 0;
                            
                            // Use the more extreme move (biggest profit or biggest loss)
                            if (Math.abs(lowestPercent) > Math.abs(highestPercent)) {
                                peakPrice = lowest.toFixed(2);
                                peakPercent = lowestPercent;
                            } else {
                                peakPrice = highest.toFixed(2);
                                peakPercent = highestPercent;
                            }
                        }
                        
                        // Calculate days, hours and minutes remaining
                        let daysLeft = 0;
                        let hoursLeft = 0;
                        let minutesLeft = 0;
                        let expireText = 'N/A';
                        if (stock.expiresAt) {
                          const now = new Date();
                          const expiry = new Date(stock.expiresAt);
                          const msRemaining = expiry - now;
                          if (msRemaining > 0) {
                            daysLeft = Math.floor(msRemaining / (1000 * 60 * 60 * 24));
                            hoursLeft = Math.floor((msRemaining / (1000 * 60 * 60)) % 24);
                            minutesLeft = Math.floor((msRemaining / (1000 * 60)) % 60);
                            expireText = `${daysLeft}d ${hoursLeft}h ${minutesLeft}m`;
                          } else {
                            // Calculate time expired (negative remaining)
                            const msExpired = Math.abs(msRemaining);
                            const daysExpired = Math.floor(msExpired / (1000 * 60 * 60 * 24));
                            const hoursExpired = Math.floor((msExpired / (1000 * 60 * 60)) % 24);
                            const minutesExpired = Math.floor((msExpired / (1000 * 60)) % 60);
                            expireText = daysExpired > 0 ? `expired ${daysExpired}d ${hoursExpired}h ago` : (hoursExpired > 0 ? `expired ${hoursExpired}h ${minutesExpired}m ago` : `expired ${minutesExpired}m ago`);
                          }
                        }
                        
                        // Format percentage with proper sign
                        const percentSign = peakPercent >= 0 ? '+' : '';
                        const peakDisplay = `Peak: $${peakPrice}   <b style="font-weight: 600;">${percentSign}${peakPercent.toFixed(2)}%</b> (Expires: ${expireText})`;
                        
                        // Determine color based on position type and performance
                        // For SHORT: positive peakPercent = profit (green), negative = loss (red)
                        // For LONG: positive peakPercent = profit (green), negative = loss (red)
                        // peakPercent is already signed correctly for both SHORT and LONG
                        let peakColor = peakPercent > 0 ? '#00aa00' : peakPercent < 0 ? '#ff4444' : 'inherit';
                        
                        item.innerHTML = `
                            <div style="margin-bottom: 5px;"><b style="font-weight: 700;"></b> $${stock.ticker} <b style="font-weight: 700; font-style: italic;">${direction}</b> @ $${stock.price}</div>
                            <div style="font-size: 10.5px; opacity: 0.6; margin-bottom: 3px;">Alert Time: ${dateStr} ${timeStr}</div>
                            <div style="font-size: 11px; opacity: 0.9; color: ${peakColor}; font-style: italic;">${peakDisplay}</div>
                        `
                        
                        item.addEventListener('click', () => {
                            customConfirm(`View details for <b><i>$${stock.ticker}</i></b>?`, saLink);
                        });
                        
                        list.appendChild(item);
                    });
                })
                .catch(e => {
                    console.error('No available history:', e);
                    const list = document.getElementById('notification-history-list');
                    list.innerHTML = '';
                    const emptyState = document.createElement('div');
                    emptyState.style.cssText = 'padding: 20px; text-align: center; opacity: 0.6; font-size: 12px;';
                    emptyState.textContent = 'No available history';
                    list.appendChild(emptyState);
                });
        }

        function createNewMessage() {
            const modal = document.createElement('div');
            modal.className = 'custom-confirm-modal';
            modal.style.zIndex = '999999999';
            modal.innerHTML = `
                <div class="custom-confirm-box">
                    <div style="margin-bottom: 12px; font-weight: 600;">Create New Message</div>

                    <textarea id="new-msg-content" placeholder="Message content" style="width: 100%; padding: 8px; border: 1px solid #555; border-radius: 4px; margin-bottom: 12px; font-size: 13px; box-sizing: border-box; min-height: 80px; font-family: inherit; resize: vertical; background: transparent; color: inherit;"></textarea>

                        <button type="button" class="custom-confirm-btn" id="create-msg-no" style="flex: 1;">Cancel</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            const titleInput = document.getElementById('new-msg-title');
            const contentInput = document.getElementById('new-msg-content');
            const errorDiv = document.getElementById('msg-error');
            const yesBtn = document.getElementById('create-msg-yes');
            const noBtn = document.getElementById('create-msg-no');
            
            const cleanup = () => {
                modal.remove();
            };
            
            yesBtn.onclick = async () => {
                const title = titleInput.value.trim();
                const content = contentInput.value.trim();
                
                if (!title || !content) {
                    errorDiv.textContent = 'Please fill in both title and message';
                    errorDiv.style.display = 'block';
                    return;
                }
                
                errorDiv.style.display = 'none';
                yesBtn.disabled = true;
                yesBtn.textContent = 'Sending...';
                
                const storageKey = getInboxStorageKey();
                const messages = JSON.parse(localStorage.getItem(storageKey)) || [];
                messages.push({
                    title: title,
                    message: content,
                    timestamp: new Date().toISOString()
                });
                localStorage.setItem(storageKey, JSON.stringify(messages));
                
                // Send to configured email
                try {
                    const response = await fetch('/api/send-message', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, message: content })
                    });
                    
                    const result = await response.json();
                    
                    if (!response.ok || !result.success) {
                        throw new Error(result.error || 'Failed to send message');
                    }
                    
                    // Add notification alert
                    addToNotificationHistory(`Message sent: "${title}"`, 'success');
                    showMessageNotification(`Message sent: ${title}`, 'success');
                    
                    cleanup();
                    loadInboxMessages();
                } catch (err) {
                    errorDiv.textContent = `Failed to send message: ${err.message}`;
                    errorDiv.style.display = 'block';
                    yesBtn.disabled = false;
                    yesBtn.textContent = 'Send';
                }
            };
            
            noBtn.onclick = cleanup;
            
            titleInput.focus();
        }


        function deleteInboxMessage(idx) {
            const storageKey = getInboxStorageKey();
            const messages = JSON.parse(localStorage.getItem(storageKey)) || [];
            if (idx < 0 || idx >= messages.length) return;
            
            const msgTitle = messages[idx]?.title || 'Message';
            
            // Remove any existing modals first
            const existingModals = document.querySelectorAll('.custom-confirm-modal');
            existingModals.forEach(modal => modal.remove());
            
            const modal = document.createElement('div');
            modal.className = 'custom-confirm-modal';
            modal.style.zIndex = '999999999';
            
            const uniqueYesId = 'delete-msg-yes-' + Date.now();
            const uniqueNoId = 'delete-msg-no-' + Date.now();
            
            modal.innerHTML = `
                <div class="custom-confirm-box">
                    <div>Delete this message?</div>
                    <div class="custom-confirm-buttons">
                        <button type="button" class="custom-confirm-btn yes" id="${uniqueYesId}">Yes</button>
                        <button type="button" class="custom-confirm-btn no" id="${uniqueNoId}">No</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            const yesBtn = document.getElementById(uniqueYesId);
            const noBtn = document.getElementById(uniqueNoId);
            
            const cleanup = () => {
                modal.remove();
            };
            
            yesBtn.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                const storageKey = getInboxStorageKey();
                const messages = JSON.parse(localStorage.getItem(storageKey)) || [];
                messages.splice(idx, 1);
                localStorage.setItem(storageKey, JSON.stringify(messages));
                addToNotificationHistory(`Message deleted: "${msgTitle}"`, 'deleted');
                showMessageNotification(`Message deleted: ${msgTitle}`, 'deleted');
                cleanup();
                loadInboxMessages();
            };
            
            noBtn.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                cleanup();
            };
        }

                    this.alerts.clear();
                    this.knownAlerts.clear();
                    
                    // Try local endpoint first (if available), fall back to GitHub raw content
                    let alertData = [];

                    // Always try local endpoint first, regardless of hostname
                    const alertUrl = '/logs/alert.json';
                    
                    try {
                        response = await fetch(alertUrl);

                            response = await fetch('https://raw.githubusercontent.com/heyitshurberto/sysd/main/logs/alert.json');

                        if (response.ok) {

                        try {

                            if (githubResponse.ok) {
                                alertData = await githubResponse.json();
                            } else {
                                alertData = [];
                            }
                        } catch (gitErr) {
                            console.error('GitHub fallback also failed:', gitErr.message);
                            alertData = [];
                        }
                    }
                    
                    smartLog('info', `Loaded ${alertData.length} alerts from alert.json`); // Log total count

                    // Load performance/PnL data for reverse split adjustments
                    let performanceData = {};
                    let stocksData = [];
                    try {
                        const quoteUrl = '/logs/quote.json';
                        const pnlResponse = await fetch(quoteUrl);
                        if (!pnlResponse.ok) {
                            // Fall back to GitHub

                                performanceData = await githubResponse.json();

                                stocksData = await githubResponse.json();
                            }

                        }
                    } catch (err) {
                        smartLog('warn', `Could not load stocks.json for peak data: ${err.message}`);
                    }

                    // Process all alerts in chronological order
                    alertData.sort((a, b) => new Date(b.alertDate) - new Date(a.alertDate));

                    // Initialize monitoring for each alert
                    let loadedCount = 0;
                    let skippedCount = 0;
                    let errorCount = 0;

                    for (const alert of alertData) {
                        try {
                            const price = parseFloat(alert.price);

                            if (!alert.ticker) {
                                smartLog('error', 'Alert missing ticker:', alert);
                                errorCount++;
                                continue;
                            }

                            if (isNaN(price) || price <= 0) {
                                smartLog('error', `Invalid price for ${alert.ticker}: ${alert.price}`);
                                errorCount++;
                                continue;
                            }

                            // Create unique key for this alert
                            const alertKey = `${alert.ticker}-${alert.alertDate}-${alert.price}`;

                            // Skip if already known
                            if (this.knownAlerts.has(alertKey)) {
                                skippedCount++;
                                continue;
                            }

                            // Convert recordedAt to actual Date object if it's a string
                            const alertTime = alert.recordedAt ? new Date(alert.recordedAt) : (alert.alertDate ? new Date(alert.alertDate) : new Date());

                            smartLog('info', `Processing alert for ${alert.ticker} at $${price}`);

                            const sharesOut = parseInt(alert.sharesOutstanding) || 0;

                            // Calculate S/O ratio as percentage (float / shares outstanding)

                            if (floatShares > 0 && sharesOut > 0) {

                              soRatio = ratio < 100 ? ratio.toFixed(2) + '%' : ratio.toFixed(1) + '%';
                            }

                            // Get performance data for this ticker if available
                            const tickerPerfData = performanceData[alert.ticker] || {};
                            
                            // Get peak price from stocks.json if available
                            const stockRecord = stocksData.find(s => s.ticker === alert.ticker);
                            const peakPriceFromStock = stockRecord && stockRecord.highest5Day ? parseFloat(stockRecord.highest5Day) : null;
                            
                            this.addAlert({

                                reverseSplitReason: alert.reverseSplitReason || null, // From alert.json
                                peakPrice: peakPriceFromStock || tickerPerfData.peakPrice || price,
                                stockPeakPrice: peakPriceFromStock || tickerPerfData.peakPrice || price, // Preserve original peak from stocks.json
                                lowPrice: peakPriceFromStock || tickerPerfData.lowPrice || price,

                                formType: alert.formType || null,
                                weightedAverage: alert.wa || null,
                                fav: alert.fav || null,
                            });

                            // Mark as known
                            this.knownAlerts.add(alertKey);

                            // Initialize milestone tracking for this ticker starting from 12%
                            // Next alerts fire on every additional +/-10% from the original alert price
                            if (!this.milestones.has(alert.ticker)) {
                                this.milestones.set(alert.ticker, { upStep: 0.20, downStep: -0.20 });
                            }

                        } catch (err) {
                            smartLog('error', `Error processing alert: ${err.message}`);
                            errorCount++;
                        }
                    }

                    smartLog('info', `Alert loading complete: ${loadedCount} loaded, ${errorCount} errors, ${skippedCount} skipped`, true);
                    this.updateDisplay();
                } catch (error) {
                    smartLog('error', 'Failed to load initial alerts: ' + error.message);
                }
            }

            addAlert(alertData) {
                // Create unique key for this alert based on ticker and time
                const alertKey = `${alertData.ticker}-${alertData.alertTime}`;
                
                // Skip if we've already processed this alert
                if (this.knownAlerts.has(alertKey)) {
                    return;
                }
                
                const isShort = Array.isArray(alertData.isShort) ? alertData.isShort.length > 0 : alertData.isShort;
                
                // Determine initial peak/low based on server-provided values
                const parsedAlertTime = alertData.alertTime ? new Date(alertData.alertTime) : new Date();
                let initialPeak = alertData.alertPrice;
                let initialLow = alertData.alertPrice;

                if (alertData.peakPrice !== undefined) {
                    initialPeak = parseFloat(alertData.peakPrice);
                }
                if (alertData.lowPrice !== undefined) {
                    initialLow = parseFloat(alertData.lowPrice);
                }

                const alert = {
                    ...alertData,
                    currentPrice: alertData.alertPrice,
                    peakPrice: initialPeak,
                    lowPrice: initialLow,
                    currentVolume: 0,
                    averageVolume: 0,
                    priceChange: 0,
                    volumeSpike: false,
                    triggered: false,
                    lastUpdated: new Date(),
                    lastTriggerLevel: 0,
                    initialValue: isShort ? -alertData.alertPrice : alertData.alertPrice
                };

                // Only store one alert per ticker - replace if exists
                this.alerts.set(alertData.ticker, [alert]);
                
                // Mark this alert as known
                this.knownAlerts.add(alertKey);

                if (alertData.signalScore > 0.0) {
                    const alertKey = `${alertData.ticker}-${alertData.alertTime.getTime()}`;
                    const now = Date.now();
                    const isRecent = this.notifiedAlerts.has(alertKey) && (now - this.notifiedAlerts.get(alertKey)) < this.recentThreshold;

                    if (!isRecent) {
                        const position = alertData.isShort ? 'SHORT' : 'LONG';
                        const type = alertData.isShort ? 'error' : 'success';
                        const ticker = `<b><i>$${alertData.ticker}</i></b>`;
                        // For new stock alerts, link to SEC filing
                        this.showNotification(`${ticker} ${position} alert received`, type, alertData.filingLink);
                        this.notifiedAlerts.set(alertKey, now);
                    }
                }

                this.updateDisplay();
            }

            async checkStockPrice(ticker) {
                try {
                    // Always try local endpoint first
                    let quote;
                    let response = await fetch(`/api/quote/${ticker}`);
                    
                    if (!response.ok) {
                        // Local API failed, try GitHub
                        try {
                            const quoteUrl = 'https://raw.githubusercontent.com/heyitshurberto/mobile/main/logs/quote.json';
                            const quoteResp = await fetch(quoteUrl);
                            if (quoteResp.ok) {
                                const quoteData = await quoteResp.json();
                                if (quoteData[ticker] && quoteData[ticker].currentPrice) {
                                    // Create a quote object matching the data format
                                    quote = {
                                        currentPrice: quoteData[ticker].currentPrice,
                                        volume: quoteData[ticker].volume || 0,
                                        averageVolume: quoteData[ticker].averageVolume || 0,
                                        marketCap: quoteData[ticker].marketCap || 'N/A'
                                    };
                                } else {
                                    console.warn(`No price data for ${ticker} in quote.json`);
                                    return false;
                                }
                            } else {
                                console.error(`Failed to fetch quote.json: ${quoteResp.status}`);
                                return false;
                            }
                        } catch (err) {
                            console.error(`Error fetching quote.json for ${ticker}:`, err);
                            return false;
                        }
                    } else {
                        try {
                            quote = await response.json();
                        } catch (parseError) {
                            console.error(`Failed to parse JSON for ${ticker}:`, parseError);
                            return false;
                        }
                    }

                    const priceValue = quote.currentPrice || quote.price || quote.current;
                    const parsedPrice = parseFloat(priceValue);
                    if (!quote || !priceValue || isNaN(parsedPrice) || parsedPrice <= 0) {
                        console.error(`Invalid quote data for ${ticker}:`, quote);
                        return false;
                    }

                    const alerts = this.alerts.get(ticker);
                    if (!alerts || !alerts.length) {
                        console.log(`No alerts found for ${ticker}`);
                        return false;
                    }

                    // Update network status to Online on successful API call
                    const statusEl = document.getElementById('status');
                    statusEl.className = 'status-online';

                    const currentPrice = parseFloat(quote.currentPrice || quote.price || quote.current);
                    const currentVolume = parseInt(quote.volume) || 0;
                    const averageVolume = parseInt(quote.averageVolume) || 0;

                    let priceChanged = false;
                    for (const alert of alerts) {
                        // Calculate price change from alert price
                        const priceChange = (currentPrice - alert.alertPrice) / alert.alertPrice;
                        const volumeSpike = averageVolume > 0 ? currentVolume / averageVolume >= this.volumeThreshold : false;

                        // Only count as changed if price is different
                        if (currentPrice !== alert.currentPrice) {
                            priceChanged = true;
                        }

                        // Update alert
                        alert.currentPrice = currentPrice;
                        
                        // Always fetch updated performance data for reverse split adjustments
                        try {
                            const quoteUrl = '/logs/quote.json';
                            let pnlResp = await fetch(quoteUrl);
                            if (!pnlResp.ok) {
                                // Fallback to GitHub
                                pnlResp = await fetch('https://raw.githubusercontent.com/heyitshurberto/mobile/main/logs/quote.json');
                            }
                            if (pnlResp.ok) {
                                const pnlData = await pnlResp.json();
                                const tickerPerf = pnlData[alert.ticker];
                                if (tickerPerf) {
                                    // Only update reverse split and performance data, NOT price (use live API price)
                                    if (tickerPerf.reverseSplitRatio) {
                                        alert.reverseSplitRatio = tickerPerf.reverseSplitRatio;  // Lock in reverse split ratio
                                    }
                                    if (tickerPerf.performance && tickerPerf.performance.adjustedPercent !== undefined) {
                                        // Attach both legacy property and performance object field
                                        alert.adjustedPercent = tickerPerf.performance.adjustedPercent;
                                        if (!alert.performance) alert.performance = {};
                                        alert.performance.adjustedPercent = tickerPerf.performance.adjustedPercent;
                                    }
                                }
                            }
                        } catch (err) {
                            // Silently fail - use calculated value
                        }
                        
                        // For LONG positions: peak = highest price (max profit), low = lowest price
                        // For SHORT positions: peak = lowest price (max profit), low = highest price
                        const isShortForPeakTracking = Array.isArray(alert.isShort) ? alert.isShort.length > 0 : (alert.isShort === true);
                        if (isShortForPeakTracking) {
                            // SHORT: profit when price GOES DOWN
                            alert.peakPrice = Math.min(alert.peakPrice, currentPrice);
                            alert.lowPrice = Math.max(alert.lowPrice, currentPrice);
                        } else {
                            // LONG: profit when price GOES UP
                            alert.peakPrice = Math.max(alert.peakPrice, currentPrice);
                            alert.lowPrice = Math.min(alert.lowPrice, currentPrice);
                        }
                        
                        alert.currentVolume = currentVolume;
                        alert.averageVolume = averageVolume;
                        alert.priceChange = priceChange;
                        alert.volumeSpike = volumeSpike;
                        alert.lastUpdated = new Date();

                        // Check for 12% initial trigger
                        if (Math.abs(priceChange) >= this.alertThreshold && !alert.triggered) {
                            alert.triggered = true;
                            this.triggerAlert(alert);
                            // On first trigger, ensure milestones exist
                            if (!this.milestones.has(alert.ticker)) {
                                this.milestones.set(alert.ticker, { upStep: 0.20, downStep: -0.20 });
                            }
                            // Initialize milestone tracking
                            if (!alert.notifiedMilestones) {
                                alert.notifiedMilestones = new Set();
                                alert.milestoneEvents = [];
                            }
                        }

                        // After initial trigger, check and notify on milestone crossings
                        const ms = this.milestones.get(alert.ticker);
                        if (ms && alert.triggered) {
                            // Initialize if needed
                            if (!alert.notifiedMilestones) {
                                alert.notifiedMilestones = new Set();
                                alert.milestoneEvents = [];
                            }
                            
                            // Upwards milestones - notify when crossed
                            while (priceChange >= ms.upStep) {
                                const milestonePercent = Math.round(ms.upStep * 100);
                                if (!alert.notifiedMilestones.has(milestonePercent)) {
                                    alert.notifiedMilestones.add(milestonePercent);
                                    
                                    // Create milestone event
                                    const direction = priceChange > 0 ? 'up' : 'down';
                                    const milestoneEvent = {
                                        percent: milestonePercent,
                                        direction: direction,
                                        timestamp: new Date(),
                                        price: currentPrice
                                    };
                                    alert.milestoneEvents.push(milestoneEvent);
                                    
                                    // Send notification
                                    const notificationMsg = `<b>$${alert.ticker}</b> is now ${direction} <b>${milestonePercent}%</b> from alert price`;
                                    this.showNotification(notificationMsg, 'success', alert.filingLink);
                                    
                                    // Send to Raspberry Pi
                                    this.sendToRaspberryPi({
                                        ...alert,
                                        priceChange: ms.upStep,
                                        isMilestone: true,
                                        milestonePercent: milestonePercent
                                    });
                                }
                                // Increment: 25% up to 100%, then 50% increments
                                if (ms.upStep < 1.0) {
                                    ms.upStep += 0.25;  // 25% increments
                                } else {
                                    ms.upStep += 0.50;  // 50% increments above 100%
                                }
                            }
                            
                            // Downwards milestones - notify when crossed
                            while (priceChange <= ms.downStep) {
                                const milestonePercent = Math.round(Math.abs(ms.downStep) * 100);
                                if (!alert.notifiedMilestones.has(-milestonePercent)) {
                                    alert.notifiedMilestones.add(-milestonePercent);
                                    
                                    // Create milestone event
                                    const direction = 'down';
                                    const milestoneEvent = {
                                        percent: -milestonePercent,
                                        direction: direction,
                                        timestamp: new Date(),
                                        price: currentPrice
                                    };
                                    alert.milestoneEvents.push(milestoneEvent);
                                    
                                    // Send notification
                                    const notificationMsg = `<b>$${alert.ticker}</b> ${direction} <b>${milestonePercent}%</b> from alert`;
                                    this.showNotification(notificationMsg, 'error', alert.filingLink);
                                    
                                    // Send to Raspberry Pi
                                    this.sendToRaspberryPi({
                                        ...alert,
                                        priceChange: ms.downStep,
                                        isMilestone: true,
                                        milestonePercent: milestonePercent
                                    });
                                }
                                // Decrement: 25% down to -100%, then 50% increments
                                if (ms.downStep > -1.0) {
                                    ms.downStep -= 0.25;  // 25% increments
                                } else {
                                    ms.downStep -= 0.50;  // 50% increments below -100%
                                }
                            }
                            
                            // Persist updated steps
                            this.milestones.set(alert.ticker, ms);
                        }
                    }

                    // Force stats update after each price check
                    this.updateDisplay();
                    return priceChanged;

                } catch (error) {
                    smartLog('error', `Failed to check ${ticker}: ${error.message}`);
                }
            }

            calculateProfitLoss() {
                let longCount = 0, longPL = 0;
                let shortCount = 0, shortPL = 0;
                let dataLoadedCount = 0;  // Track if prices have actually loaded

                this.alerts.forEach(alerts => {
                    // Ensure we're working with an array
                    const alertArray = Array.isArray(alerts) ? alerts : [alerts];
                    
                    alertArray.forEach(alert => {
                        if (!alert || !alert.currentPrice || !alert.alertPrice) return;
                        
                        // Check if currentPrice is actually different from alertPrice (prices have loaded)
                        // If currentPrice === alertPrice, data hasn't loaded yet - skip for now
                        const pricesAreUpdated = alert.currentPrice !== alert.alertPrice;
                        
                        // Detect if short: check isShort OR short field (can be boolean, array, or undefined)
                        const isShort = (Array.isArray(alert.isShort) ? alert.isShort.length > 0 : (alert.isShort === true || alert.short === true)) || alert.position === 'short';
                        
                        // Use 5d best PEAK % from performance data, fallback to current price P&L
                        let returnPercent;
                        if (alert.performance && typeof alert.performance.adjustedPeakPercent === 'number') {
                            returnPercent = alert.performance.adjustedPeakPercent;
                        } else if (alert.performance && typeof alert.performance.peakPercent === 'number') {
                            returnPercent = isShort ? -alert.performance.peakPercent : alert.performance.peakPercent;
                        } else {
                            // Fallback: calculate from current price
                            let priceChangePercent = ((alert.currentPrice - alert.alertPrice) / alert.alertPrice) * 100;
                            returnPercent = isShort ? -priceChangePercent : priceChangePercent;
                        }
                        
                        if (isNaN(returnPercent)) return;
                        
                        // Only count this if prices have actually loaded (not initial state where current === alert price)
                        if (pricesAreUpdated) {
                            dataLoadedCount++;
                            if (isShort) {
                                shortCount++;
                                shortPL += returnPercent;
                            } else {
                                longCount++;
                                longPL += returnPercent;
                            }
                        }
                    });
                });

                // Check if we've exceeded the loading timeout
                const elapsedTime = Date.now() - this.dataLoadStartTime;
                const hasTimedOut = elapsedTime > this.loadingTimeoutMs;

                // If no prices have loaded yet, check if we should show Loading or 0.00%
                if (dataLoadedCount === 0) {
                    if (hasTimedOut) {
                        // Timeout exceeded - show 0.00% instead of Loading
                        return {
                            total: '0.00',
                            longStr: '0.00',
                            shortStr: '0.00',
                            longCount: 0,
                            shortCount: 0
                        };
                    } else {
                        // Still within loading timeout
                        return {
                            total: 'Loading...',
                            longStr: 'Loading...',
                            shortStr: 'Loading...',
                            longCount: 0,
                            shortCount: 0
                        };
                    }
                }

                // Calculate averages by position type
                const longAvg = longCount > 0 ? longPL / longCount : 0;
                const shortAvg = shortCount > 0 ? shortPL / shortCount : 0;
                
                // Total P&L is the unweighted average of ALL trades (equal weight per position, not per dollar)
                const totalCount = longCount + shortCount;
                const totalPL = totalCount > 0 ? (longPL + shortPL) / totalCount : 0;
                const totalPLStr = totalPL.toFixed(2);

                // Return averages for display
                const longPLStr = longAvg.toFixed(2);
                const shortPLStr = shortAvg.toFixed(2);

                return {
                    total: totalPLStr,
                    longStr: longPLStr,
                    shortStr: shortPLStr,
                    longCount,
                    shortCount
                };
            }

        // ===== FILTER, SORT & SEARCH FUNCTIONS =====

        function filterAndSortAlerts() {
            const searchTerm = document.getElementById('search-ticker').value.toUpperCase();
            const direction = document.getElementById('filter-direction').value;
            const sortBy = document.getElementById('sort-by').value;
            const filterDate = document.getElementById('filter-date').value;
            
            // Filter alerts
            filteredAlerts = allAlerts.filter(alert => {
                // Search filter - search in both ticker and company name
                if (searchTerm && !alert.ticker.includes(searchTerm) && !(alert.companyName && alert.companyName.toUpperCase().includes(searchTerm))) return false;
                
                // Direction filter
                if (direction && alert.direction !== direction) return false;
                
                // Date filter
                if (filterDate) {
                    const alertDate = new Date(alert.recordedAt).toISOString().split('T')[0];
                    if (alertDate !== filterDate) return false;
                }
                
                return true;
            });
            
            // Sort alerts
            filteredAlerts.sort((a, b) => {
                switch(sortBy) {
                    case 'price-change':
                        const changeA = parseFloat(a.highest5DayPercent) || parseFloat(a.lowest5DayPercent) || 0;
                        const changeB = parseFloat(b.highest5DayPercent) || parseFloat(b.lowest5DayPercent) || 0;
                        return changeB - changeA;
                    case 'score':
                        return (b.signalScore || 0) - (a.signalScore || 0);
                    case 'oldest':
                        return new Date(a.recordedAt) - new Date(b.recordedAt);
                    case 'newest':
                    default:
                        return new Date(b.recordedAt) - new Date(a.recordedAt);
                }
            });
            
            // Re-render alerts
            renderFilteredAlerts();
        }

            if (filteredAlerts.length === 0) {

                return;
            }
            
            filteredAlerts.forEach(alert => {
                // Re-use existing alert rendering
                const card = createAlertCard(alert);
                container.appendChild(card);
            });

        function checkPriceNotifications(alert, currentPrice) {
            const settings = JSON.parse(localStorage.getItem('pushNotifSettings') || '{}');
            if (!settings.enabled) return;
            
            const alertPrice = parseFloat(alert.price);
            const change = ((currentPrice - alertPrice) / alertPrice * 100);
            const absChange = Math.abs(change);
            
            if (absChange >= settings.threshold) {
                // Check direction filter
                if (settings.longOnly && alert.direction === 'SHORT') return;
                if (settings.shortOnly && alert.direction === 'LONG') return;
                
                // Check type filter
                if (settings.type === 'up' && change < 0) return;
                if (settings.type === 'down' && change > 0) return;
                
                // Send notification
                const direction = change > 0 ? '📈 UP' : '📉 DOWN';
                if ('Notification' in window && Notification.permission === 'granted') {
                    new Notification(`${alert.ticker} ${direction} ${Math.abs(change).toFixed(2)}%`, {
                        body: `$${alertPrice.toFixed(2)} → $${currentPrice.toFixed(2)}`,
                        icon: 'logo.jpeg',
                        tag: `alert-${alert.recordId}`
                    });
                }
            }
        }

        // Helper function to format signal values with proper conjunction
        function formatSignalValue(category, values) {
            // If not an array, return as is
            if (!Array.isArray(values)) {
                return values;
            }
            
            // For Clinical Success with multiple phases, join with commas and "and"
            if (category === 'Clinical Success' && values.length > 0) {
                const phases = values.filter(v => v.includes('Phase'));
                const nonPhases = values.filter(v => !v.includes('Phase'));
                
                let result = '';
                
                // Format phases with commas and "and"
                if (phases.length > 1) {
                    result += phases.slice(0, -1).join(', ') + ' and ' + phases[phases.length - 1];
                } else if (phases.length === 1) {
                    result += phases[0];
                }
                
                // Add non-phase items
                if (nonPhases.length > 0) {
                    if (result) result += '\n';
                    result += nonPhases.join('\n');
                }
                
                return result;
            }
            
            // For all other categories, join with newlines
            return values.join('\n');
        }

        // Debounce function to prevent rapid-fire events
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Helper function to format market cap string
        function formatAlertAge(alertTime) {
            const now = new Date();
            const diff = now - alertTime;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(minutes / 60);
            
            if (minutes < 60) {
                return `${minutes}m ago`;
            } else if (hours < 24) {
                return `${hours}h ${minutes % 60}m ago`;
            } else {
                const days = Math.floor(hours / 24);
                return `${days}d ${hours % 24}h ago`;
            }
        }
